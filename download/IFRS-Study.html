<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IFRS Study Site</title>
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface2:#eef1f5; --text:#1b2330; --muted:#5b6678;
  --border:#d9dfe7; --accent:#0b6b5d; --accent-text:#ffffff; --accent-soft:#d9f0ec;
  --good:#17803d; --good-soft:#dff3e6; --bad:#b42318; --bad-soft:#fde6e3; --warn:#9a5b00; --warn-soft:#fff1d6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --surface:#171e28; --surface2:#1f2835; --text:#e6ebf2; --muted:#9aa6b8;
    --border:#2a3545; --accent:#3cc2ad; --accent-text:#06231e; --accent-soft:#12312d;
    --good:#5fd38a; --good-soft:#12301e; --bad:#ff8a7d; --bad-soft:#3a1814; --warn:#f5c26b; --warn-soft:#3a2a0c;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --surface2:#1f2835; --text:#e6ebf2; --muted:#9aa6b8;
  --border:#2a3545; --accent:#3cc2ad; --accent-text:#06231e; --accent-soft:#12312d;
  --good:#5fd38a; --good-soft:#12301e; --bad:#ff8a7d; --bad-soft:#3a1814; --warn:#f5c26b; --warn-soft:#3a2a0c;
  --shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{font-weight:800;font-size:1.15rem;text-decoration:none;color:var(--text);letter-spacing:.2px}
.brand span{color:var(--accent)}
.icon-btn{border:1px solid var(--border);background:var(--surface2);border-radius:8px;min-width:38px;height:38px;padding:0 10px}

.search-wrap{position:relative;flex:1;max-width:520px;margin-inline:auto}
#search{width:100%;height:38px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;padding:0 12px}
.search-results{position:absolute;inset-inline:0;top:44px;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.search-results a{display:block;padding:10px 14px;text-decoration:none;color:var(--text);border-bottom:1px solid var(--border)}
.search-results a:hover,.search-results a:focus{background:var(--accent-soft)}
.search-results small{display:block;color:var(--muted)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 240px;gap:0;max-width:1500px;margin:0 auto}
.sidebar{position:sticky;top:55px;align-self:start;height:calc(100vh - 55px);overflow:auto;padding:16px 12px;border-inline-end:1px solid var(--border)}
.sidebar a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--text);margin-bottom:2px}
.sidebar a:hover{background:var(--surface2)}
.sidebar a.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.sidebar .count{font-size:.78rem;color:var(--muted);background:var(--surface2);border-radius:99px;padding:0 8px}
.sidebar .sub{margin:2px 0 8px;padding-inline-start:14px}
.sidebar .sub a{font-size:.9rem;padding:5px 10px;color:var(--muted)}
.sidebar .sub a.active{color:var(--accent)}
.main{padding:24px clamp(16px,3vw,40px) 80px;min-width:0;outline:none}
.toc{position:sticky;top:55px;align-self:start;max-height:calc(100vh - 55px);overflow:auto;padding:20px 12px;font-size:.88rem;border-inline-start:1px solid var(--border)}
.toc h4{margin:0 0 8px;color:var(--muted);font-weight:600}
.toc a{display:block;padding:3px 8px;color:var(--muted);text-decoration:none;border-inline-start:2px solid transparent}
.toc a.l3{padding-inline-start:20px}
.toc a.on{color:var(--accent);border-inline-start-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.grid a.card{text-decoration:none;color:var(--text);display:block}
.grid a.card:hover{border-color:var(--accent)}
h1{font-size:1.9rem;line-height:1.25;margin:.2em 0 .5em}
h2{font-size:1.4rem;margin:1.8em 0 .5em;padding-bottom:.25em;border-bottom:1px solid var(--border)}
h3{font-size:1.15rem;margin:1.4em 0 .4em}
.badge{display:inline-block;font-size:.75rem;border-radius:99px;padding:1px 10px;background:var(--surface2);color:var(--muted);margin-inline-end:6px}
.badge.ready{background:var(--good-soft);color:var(--good)} .badge.planned{background:var(--warn-soft);color:var(--warn)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.md table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;margin:1em 0}
.md th,.md td{border:1px solid var(--border);padding:7px 10px;vertical-align:top;text-align:start}
.md th{background:var(--surface2)}
.md blockquote{margin:1em 0;padding:.4em 1em;border-inline-start:4px solid var(--accent);background:var(--accent-soft);border-radius:6px}
.md code{background:var(--surface2);padding:1px 6px;border-radius:5px;font-size:.92em;direction:ltr;unicode-bidi:embed}
.md pre{background:var(--surface2);padding:12px;border-radius:8px;overflow:auto;direction:ltr;text-align:left}
.md pre code{background:none;padding:0}
.md ul,.md ol{padding-inline-start:1.6em}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px}
.pager a{flex:1;text-decoration:none;border:1px solid var(--border);border-radius:10px;padding:10px 14px;background:var(--surface);color:var(--text)}
.pager small{display:block;color:var(--muted)}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
select{height:38px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:0 10px}
.opt{display:block;width:100%;text-align:start;margin:8px 0;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.explain{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface2)}
.flash{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.25rem;padding:28px;cursor:pointer;user-select:none}
.flash small{display:block;color:var(--muted);margin-top:12px;font-size:.8rem}
.empty{color:var(--muted);padding:30px;text-align:center}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stats .card{flex:1;min-width:150px;text-align:center}
.stats b{font-size:1.6rem;display:block}
table.plain{width:100%;border-collapse:collapse}
table.plain td,table.plain th{border-bottom:1px solid var(--border);padding:8px 6px;text-align:start}
@media (max-width:1100px){.layout{grid-template-columns:240px minmax(0,1fr)}.toc{display:none}}
@media (max-width:760px){
  #menuBtn{display:inline-block}
  .layout{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;top:55px;bottom:0;inset-inline-start:0;width:280px;height:auto;z-index:25;background:var(--surface);transform:translateX(-110%);transition:transform .2s}
  html[dir="rtl"] .sidebar{transform:translateX(110%)}
  .sidebar.open{transform:none!important}
  .brand{font-size:1rem}
}
@media print{.topbar,.sidebar,.toc,.pager,.actions{display:none!important}.layout{display:block}}
.main,.md{overflow-wrap:anywhere}
.md table{overflow-wrap:normal}

.sidebar .grp{margin-bottom:2px}
.sidebar .grow{display:flex;align-items:center;gap:6px;border-radius:8px}
.sidebar .grow.active{background:var(--accent-soft)}
.sidebar .grow a{flex:1;margin:0;padding:8px 12px}
.sidebar .grow .count{font-size:.78rem;color:var(--muted);background:var(--surface2);border-radius:99px;padding:0 8px}
.sidebar .chev{border:0;background:transparent;font-size:1rem;width:32px;height:32px;border-radius:8px;color:var(--muted)}
.sidebar .chev:hover{background:var(--surface2)}
.sidebar .sub{max-height:60vh;overflow:auto}
.sidebar .sub a .dot{width:9px;height:9px;border-radius:50%;background:var(--border);flex:none}
.sidebar .sub a .dot.ok{background:var(--good)} .sidebar .sub a .dot.part{background:var(--warn)}
body.nomenu .layout{grid-template-columns:minmax(0,1fr) 240px}
body.nomenu .sidebar{display:none}
@media (max-width:1100px){body.nomenu .layout{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:6px;margin:6px 0 18px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{border:0;background:transparent;padding:9px 16px;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
/* visual blocks */
.vbox{border-radius:12px;margin:1.2em 0;border:1px solid var(--border);border-inline-start-width:5px;background:var(--surface);overflow:hidden}
.vbox .vt{padding:8px 14px;font-weight:700;background:var(--surface2)}
.vbox .vb{padding:4px 14px 10px}
.vbox .vb>:first-child{margin-top:.6em}
.vbox.tip{border-inline-start-color:var(--accent)} .vbox.tip .vt{background:var(--accent-soft);color:var(--accent)}
.vbox.warn,.vbox.trap{border-inline-start-color:var(--warn)} .vbox.warn .vt,.vbox.trap .vt{background:var(--warn-soft);color:var(--warn)}
.vbox.example{border-inline-start-color:var(--good)} .vbox.example .vt{background:var(--good-soft);color:var(--good)}
.vbox.keyterm{border-inline-start-color:#6b5bd2} .vbox.keyterm .vt{background:var(--surface2);color:#6b5bd2}
.vbox.summary{border-inline-start-color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:1.2em 0}
.fstep{flex:1 1 150px;min-width:130px;background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--accent);border-radius:10px;padding:10px 12px;position:relative}
.fstep .fn{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-text);align-items:center;justify-content:center;font-size:.8rem;font-weight:700;margin-inline-end:6px}
.fstep small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}
.farrow{align-self:center;color:var(--muted);font-size:1.2rem}
.flow:dir(rtl) .farrow{transform:scaleX(-1)}
@media (max-width:760px){.flow{flex-direction:column}.farrow{transform:rotate(90deg)!important;align-self:center}}
.timeline{margin:1.2em 0;border-inline-start:3px solid var(--border);padding-inline-start:18px}
.tl{position:relative;padding:0 0 14px}
.tl i{position:absolute;inset-inline-start:-27px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.tl b{display:block}.tl span{color:var(--muted)}
.journal{margin:1.2em 0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.journal .vt{padding:8px 14px;font-weight:700;background:var(--surface2)}
.journal table{width:100%;border-collapse:collapse}
.journal th,.journal td{padding:7px 12px;border-top:1px solid var(--border);text-align:start}
.journal th{background:var(--surface2);font-size:.85rem;color:var(--muted)}
.journal td:nth-child(2),.journal td:nth-child(3),.journal th:nth-child(2),.journal th:nth-child(3){width:110px;text-align:end;font-variant-numeric:tabular-nums}
.journal tr.dr td:first-child{font-weight:600}
.journal .jn{padding:8px 14px;color:var(--muted);border-top:1px solid var(--border);font-size:.92rem}
.bars{margin:1.2em 0;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.bars .vt,.split .vt{font-weight:700;margin-bottom:8px}
.brow{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:10px;align-items:center;margin:6px 0}
.bt{height:16px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--accent);border-radius:99px}.bt i.neg{background:var(--bad)}
.bv{font-variant-numeric:tabular-nums;font-size:.92rem;direction:ltr}
.split{margin:1.2em 0;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.sbar{display:flex;height:34px;border-radius:8px;overflow:hidden;direction:ltr}
.sbar i{display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:.85rem;font-weight:700;min-width:2px}
.slg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.92rem}
.slg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px}
.c0{background:#0b6b5d}.c1{background:#c2570c}.c2{background:#6b5bd2}.c3{background:#b42318}.c4{background:#1b6fb3}.c5{background:#7a7f1a}
.tree{margin:1.2em 0}.tree ul{list-style:none;margin:0;padding-inline-start:22px;border-inline-start:2px solid var(--border)}
.tree>ul{border:0;padding-inline-start:0}
.tree li{margin:6px 0}
.tree .tn{display:inline-block;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 11px}
.tree em{font-style:normal;font-size:.78rem;font-weight:700;border-radius:99px;padding:1px 9px;margin-inline-end:6px}
.tree em.y{background:var(--good-soft);color:var(--good)}.tree em.n{background:var(--bad-soft);color:var(--bad)}

.bars,.split,.journal,.flow,.timeline,.tree{text-align:start}
.sbar{direction:ltr}
.toc a.l1{font-weight:700;color:var(--text);margin-top:6px}
.toc a.l3{padding-inline-start:20px}

</style>

<header class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
  <a class="brand" href="#/home">IFRS<span>Study</span></a>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="ابحث / Search…" autocomplete="off" aria-label="Search">
    <div id="searchResults" class="search-results" hidden></div>
  </div>
  <button id="langBtn" class="icon-btn" title="Language">EN</button>
  <button id="themeBtn" class="icon-btn" title="Dark / Light">◐</button>
</header>

</div>
<div id="scrim" class="scrim" hidden></div>
<script>
window.IFRS_DATA = {"pages": [{"id": "ifrs/ifrs-15", "section": "ifrs", "title": "IFRS 15 — Revenue from Contracts with Customers / الإيراد من العقود مع العملاء", "standard": "IFRS 15", "version": "As taught in BPP DipIFR Study Text 2025-26 (21st ed.), Ch 3", "effective_date": "Issued May 2014 (ST p.40). Effective date: exact source reference could not be verified from the uploaded document.", "source": "Study Text Ch 3 (p.39-58); Kit Q2, Q3, Q4, Q9, Q15, Q33", "body": "\n# Overview / نظرة عامة\n\n```summary\n# الفكرة في سطر واحد\nالإيراد يُسجَّل عندما تنتقل **السيطرة** على السلعة أو الخدمة إلى العميل، وبالمبلغ الذي تتوقع المنشأة أن تستحقه. (ST p.40)\n```\n\n**Simple explanation.** You promised something to a customer. When you hand over control of it, you can record revenue. If the job takes months (a building), you record revenue as the work progresses.\n\n**Technical explanation.** IFRS 15 sets one model for all contracts with customers. Its core principle is that revenue depicts the transfer of promised goods or services in an amount that reflects the consideration the entity expects to be entitled to. Transfer is judged by **control**: the ability to direct the use of the asset and obtain substantially all of its remaining benefits (ST p.40).\n\n# Scope and key definitions / النطاق والتعريفات\n\nIFRS 15 applies to all contracts with customers except (ST p.41, para. 5 as quoted):\n- Leases (IFRS 16)\n- Insurance contracts (IFRS 4)\n- Financial instruments and other rights and obligations in the scope of IFRS 9, IFRS 10, IFRS 11, IAS 27 or IAS 28\n- Non-monetary exchanges between entities in the same line of business\n\n| Term | العربية | Meaning (own wording, from ST p.41) |\n|---|---|---|\n| Contract | عقد | Agreement between two or more parties that creates enforceable rights and obligations |\n| Performance obligation | التزام أداء | Promise to transfer a distinct good or service (or a series of distinct, substantially the same goods or services) |\n| Transaction price | سعر المعاملة | Amount the entity expects to be entitled to, excluding amounts collected for third parties (e.g. sales tax) |\n| Stand-alone selling price | سعر البيع المنفرد | Price at which the entity would sell the good or service separately |\n| Contract asset | أصل العقد | Right to consideration for goods/services already transferred, **conditional on something other than time** (e.g. future performance) |\n| Receivable | ذمة مدينة | Right to consideration that is **unconditional**: only time must pass |\n| Contract liability | التزام العقد | Obligation to transfer goods/services for which the entity has already received (or is due) consideration |\n\n```tip\n# Sales tax is not revenue\nVAT and similar taxes collected only for third parties are not an economic benefit to the entity, so they are excluded from revenue. (ST p.41)\n```\n\n# The five-step model / نموذج الخطوات الخمس\n\n```flow\nIdentify the contract :: Step 1\nIdentify the performance obligations :: Step 2\nDetermine the transaction price :: Step 3\nAllocate the price to the obligations :: Step 4\nRecognise revenue when (or as) each obligation is satisfied :: Step 5\n```\n\n```warn\n# Exam point (ST p.42)\nDo **not** just list the five steps unless the question asks for them. The examiner's report for June 2024 raised this again. Apply the steps to the facts instead.\n```\n\n## Step 1 — The contract (ST p.42, paras. 9-10)\n\nA contract is within IFRS 15 only when all of these are met:\n- The parties approved it and are committed to it\n- Each party's rights over the goods/services can be identified\n- Payment terms can be identified\n- It has commercial substance\n- Collection of the consideration is probable\n\nIt can be written, verbal or implied.\n\n## Step 2 — Performance obligations (ST p.42-43)\n\nA promised good or service is **distinct** if both are true:\n\n```tree\nIs it distinct?\n  Y: Can the customer benefit from it on its own (or with resources readily available)?\n    Y: Is the promise separately identifiable from the other promises in the contract?\n      Y: **Separate performance obligation**\n      N: Combine with the other promises (they form one combined output)\n    N: Combine with other promises\n```\n\n```example\n# Office Solutions and CommSoft (ST p.43)\nContract with Logisticity: (a) software licence, (b) installation (no customisation), (c) 3 years of technical support, (d) 3 years of updates.\nOther companies can install and support CommSoft, and the software works without updates or support.\n**Conclusion:** each item is distinct, so there are **four performance obligations**. The installation does not significantly modify the software, so it is a separate output, not an input to a combined one.\n```\n\n## Step 3 — Transaction price (ST p.43-44, paras. 47-72)\n\nThe price includes the **probability-weighted estimate of variable consideration** (discounts, rebates, refunds, price concessions, credits, penalties), the effect of customer credit risk, and the time value of money if material.\n\n```keyterm\n# The constraint on variable consideration\nVariable amounts are included only where it is **highly probable** that there will not be a significant reversal of revenue when the uncertainty is resolved. (ST p.43)\n```\n\n### Example A — Volume discount (Taplop, ST p.43-44)\n\nPrice $500 per laptop, falling retrospectively to $450 if TrillCo buys more than 500 in the year.\n\n```timeline\nQuarter to 30 Sep 20X5 :: TrillCo bought 70 laptops. Taplop expects fewer than 500 in the year, so a reversal is not expected. Revenue = 70 x $500 = **$35,000**.\nQuarter to 31 Dec 20X5 :: TrillCo buys 250 more and Taplop now expects to pass 500 units, so the price becomes $450 for all units.\nRevenue in the quarter :: 250 x $450 = $112,500, less the $3,500 price cut on the first 70 units (70 x $50) = **$109,000**.\n```\n\n```bars\ntitle: Revenue recognised by quarter (Taplop)\nunit: $\nQuarter to 30 Sep 20X5 | 35000\nQuarter to 31 Dec 20X5 | 109000\n```\n\n```journal\n# Quarter to 31 December 20X5 (prepared from ST figures)\nDr Trade receivables | 112,500\nCr Revenue | 109,000\nCr Refund liability / reduction of earlier receivable | 3,500\nnote: The $3,500 corrects revenue already recorded for the first 70 units. The exact account used for the reduction is a presentation choice; the revenue effect is the point.\n```\n\n### Example B — Significant financing component (Lansdale, ST p.44)\n\nProduct X sold on 31 Dec 20X7 for $12,100 payable 24 months after delivery. Cash price $10,000. Cost $8,000.\n\n```flow\nAt delivery :: Revenue and receivable = **$10,000** (cash price)\nOver 24 months :: Difference of $2,100 is **interest income**\nRate :: 12,100 / 10,000 = 1.21 = 1.10 x 1.10, so the effective rate is 10% a year (our calculation)\nPresentation :: Interest income in the operating category (ST p.44)\n```\n\n```journal\n# 31 December 20X7\nDr Trade receivable | 10,000\nCr Revenue | 10,000\n```\n\n```journal\n# 31 December 20X7 (cost of the product)\nDr Cost of sales | 8,000\nCr Inventory | 8,000\n```\n\n```journal\n# Years ended 31 December 20X8 and 20X9 (our calculation at 10%)\nDr Trade receivable (20X8) | 1,000\nCr Interest income | 1,000\nnote: 20X9: interest = (10,000 + 1,000) x 10% = 1,100. Total interest 1,000 + 1,100 = 2,100.\n```\n\n## Step 4 — Allocation (ST p.45)\n\nAllocate the transaction price to each obligation **in proportion to stand-alone selling prices (SSPs)**. If not sold separately, estimate the SSP.\n\n### Example C — Free handset (ST p.45)\n\nHandset SSP $100. Two-year network contract at $20 a month = $480 total.\n\n```split\ntitle: Standalone selling prices (total $580)\nHandset | 100\nNetwork service (2 years) | 480\n```\n\n```split\ntitle: Allocation of the $480 actually received\nHandset (17%) = $82 | 82\nNetwork service (83%) = $398 | 398\n```\n\n```timeline\nYear 1 revenue :: Handset $82 + service $398 / 2 = $199, total **$281**\nYear 2 revenue :: Service **$199**\nEffect :: IFRS 15 moves $41 of revenue from Year 2 to Year 1 (under the old approach: $240 each year)\n```\n\n### Example D — Warranties (Premier Co, ST p.47)\n\nMachine sold for $196,000 (its SSP). A standard one-year assurance warranty is included. As a new customer, an extra six-month warranty is given free; it normally sells for $4,000.\n\n```split\ntitle: Allocating $196,000 (total SSP $200,000)\nMachine ($196,000 SSP) | 192080\nExtended warranty ($4,000 SSP) | 3920\n```\n\n- Machine revenue **$192,080** at delivery, when control passes.\n- Extended warranty **$3,920** recognised over the extra six months.\n- The standard assurance warranty is **not** a performance obligation. It is a provision under IAS 37.\n\n## Step 5 — When is the obligation satisfied? (ST p.45-46)\n\n```tree\nDo any of the over-time criteria apply?\n  Y: **Recognise revenue OVER TIME** (measure progress, see below)\n  N: **Recognise revenue at a POINT IN TIME** when the customer obtains control\n```\n\n**Over time if one of these is met** (ST p.45):\n1. The customer simultaneously receives and consumes the benefit as the entity performs\n2. The entity's work creates or enhances an asset the customer controls as it is built\n3. The work creates no asset with an alternative use to the entity, **and** the entity has an enforceable right to payment for work done to date\n\n**Point in time, indicators of control** (ST p.46): present right to payment; legal title; physical possession; risks and rewards transferred; customer acceptance.\n\n**Measuring progress** (ST p.46):\n\n| Method | Basis | Examples |\n|---|---|---|\n| Output methods | Value to the customer of what has been transferred | Surveys of work done, units produced or delivered |\n| Input methods | The entity's inputs | Labour hours, costs incurred (costs must contribute to progress) |\n\nIf the outcome cannot be measured reliably early in a contract but costs will be recovered, recognise revenue only up to **costs incurred** (ST p.46).\n\n# Contract costs / تكاليف العقد (ST p.46)\n\n```tree\nIs it a cost of obtaining the contract?\n  Y: Incremental (would not exist if the contract were not won, e.g. sales commission)?\n    Y: **Capitalise as an asset** if recoverable\n    N: **Expense** as incurred (cost incurred anyway)\n  N: Cost of fulfilling the contract. In the scope of IAS 2, IAS 16 or IAS 38?\n    Y: Follow that standard\n    N: Capitalise if it relates directly to a contract, creates/enhances resources for future performance, and is expected to be recovered\n```\n\nCapitalised costs are amortised consistently with the transfer of the related goods or services.\n\n# Common types of transaction / أنواع معاملات شائعة (ST p.47-51)\n\n## Principal or agent? (ST p.48)\n\n```tree\nDoes the entity control the good/service before it goes to the customer?\n  Y: **Principal**: revenue = gross amount\n  N: **Agent**: revenue = fee or commission only\n```\n\nIndicators of a principal: primarily responsible for fulfilment; bears inventory risk; sets the price.\n\n```example\n# Fancy Goods Co (ST p.48)\nWebsite where suppliers set prices and deliver directly. FG earns 5% commission and has no further obligation.\nSupplier is responsible for fulfilment; FG holds no inventory; FG sets no prices. **FG is an agent.** Revenue = commission received.\n```\n\n## Repurchase agreements (ST p.48-49)\n\n| Form | Customer obtains control? | Accounting |\n|---|---|---|\n| Forward (must repurchase) or call option (right to repurchase) | No | Repurchase price below original price: **lease** (IFRS 16). Equal or above: **financing** |\n| Put option (customer can require repurchase) | Depends on incentive | Significant economic incentive to exercise: **lease**. No incentive and price below original: sale with right of return. Price at or above original and above expected market value: financing |\n\n```example\n# Call option, A Co (ST p.49)\nSells an asset for $1m on 1 Jan 20X7 with a right to repurchase for $1.1m by 31 Dec 20X7. Control is not transferred, so it is a **financing**: A Co keeps the asset, books a $1m financial liability and $0.1m interest. If the option lapses, A Co derecognises the asset and recognises revenue of **$1.1m**.\n```\n\n```journal\n# 1 January 20X7 (prepared from ST figures)\nDr Cash | 1,000,000\nCr Financial liability | 1,000,000\n```\n\n```journal\n# Over 20X7\nDr Interest expense | 100,000\nCr Financial liability | 100,000\n```\n\n```journal\n# 31 December 20X7, option lapses\nDr Financial liability | 1,100,000\nCr Revenue | 1,100,000\nnote: A Co also derecognises the asset to cost of sales at its carrying amount, which the example does not give.\n```\n\n```example\n# Put option (ST p.49)\nSame sale, but A Co must repurchase at B Co's request for $900,000 while the expected market value is $750,000. B Co has a significant economic incentive to exercise, so control does not pass. A Co accounts for a **lease** (IFRS 16); the $100,000 difference is treated as lease payments received.\n```\n\n## Consignment (ST p.49-51)\n\nIndicators that the dealer does **not** control the goods: manufacturer controls them until a trigger (e.g. sale on, time passes); manufacturer can demand them back; dealer has no unconditional obligation to pay.\n\n```example\n# Jameson Co and Rochester Diamonds (ST p.50-51)\nRochester keeps legal title and the right to change the price, unsold items go back after nine months, and Jameson pays only when items sell (deposit netted off).\n**Consignment: Jameson does not include the jewellery in inventory.** Revenue for the manufacturer comes when Jameson sells to the end customer.\n```\n\n## Bill-and-hold (ST p.51)\n\nThe customer has control only if **all four** are met: the reason is substantive (e.g. customer asked); the goods are separately identified as the customer's; they are ready for transfer; the entity cannot use them or send them to someone else.\n\n```example\n# Machine and spare parts (ST p.51)\nCustomer pays on 31 Dec 20X9, takes the machine, and asks the entity to store the inspected, accepted spare parts. **Three performance obligations**: machine (point in time, 31 Dec 20X9), spare parts (point in time, same date) and **storage service (over time)**.\n```\n\n## Sale with right of return (ST p.51)\n\nDo not recognise revenue for goods expected to be returned. Estimate by expected value or most likely amount. Show a **refund liability** and reduce revenue. Recognise an **asset** for the right to recover the goods, adjusted against cost of sales (para. B20).\n\n## Warranties (ST p.47)\n\n- Customer can buy the warranty separately, or it gives a service beyond assurance: **separate performance obligation**.\n- Required by law or assurance only: **IAS 37**, not a performance obligation.\n\n# Presentation / العرض (ST p.52)\n\n```tree\nHas the customer paid (or is payment due) before the entity performs?\n  Y: **Contract liability**\n  N: Has the entity performed but not yet been paid?\n    Y: Is the right to payment conditional on more than the passage of time?\n      Y: **Contract asset**\n      N: **Receivable**\n    N: Nothing to recognise yet\n```\n\n- Revenue invoiced: receivable. Revenue earned but not invoiced: contract asset.\n- Contract assets and liabilities are presented separately, under current assets and current liabilities (ST p.53).\n- Loss-making contracts are onerous contracts under IAS 37 (ST p.53).\n- Interest income from a financing component sits in the operating category (ST p.44).\n- The Study Text gives no detailed IFRS 15 disclosure list. Exact source reference could not be verified from the uploaded document.\n\n# Calculations / الحسابات\n\n**Over-time contract, input method (costs to costs):**\n\n```flow\n% complete :: Costs to date / (costs to date + estimated costs to complete)\nRevenue :: % complete x total contract price\nCost of sales :: Costs incurred to date\nContract asset :: Revenue recognised - amounts invoiced (if positive)\nContract liability :: Amounts invoiced - revenue recognised (if positive)\n```\n\n## Example E — Tower block (ST p.52-53)\n\nPrice $1,500,000. Year 1: costs $600,000; certified 50% complete (output method); certificates $750,000; further costs $600,000.\n\n```bars\ntitle: Year 1 profit or loss ($)\nRevenue | 750000\nCost of sales | -600000\nProfit | 150000\n```\n\n```journal\n# 31 December 20X5\nDr Contract asset | 750,000\nCr Revenue | 750,000\nnote: No amount is invoiced, so none is a receivable.\n```\n\n```journal\nDr Cost of sales | 600,000\nCr Cash / payables (costs incurred) | 600,000\n```\n\n## Example F — P Co (ST p.54)\n\nPrice $750m. Costs incurred $225m. Estimated costs to complete $340m. Invoiced and received $290m. Input method.\n\n```flow\n% complete :: 225 / (225 + 340) = 39.8%, rounded to 40% in the Study Text\nRevenue :: 40% x $750m = $300m\nCost of sales :: $225m\nProfit :: $75m\nContract asset :: $300m - $290m = $10m\n```\n\n## Example G — Santolina Co (ST p.55)\n\nBuilding contract: total revenue $290,000, value of performance obligations satisfied to date $230,000, costs to date $210,450, amounts invoiced $210,000, cash received $194,000. Separately, bricks sold to the customer at a point in time: $14,000 on credit, cost $10,000.\n\n```bars\ntitle: Statement of profit or loss ($)\nRevenue (230,000 + 14,000) | 244000\nCost of sales (210,450 + 10,000) | -220450\nGross profit | 23550\n```\n\n- Contract asset: $230,000 - $210,000 = **$20,000**\n- Trade receivables: $210,000 - $194,000 + $14,000 = **$30,000**\n\n# Past-exam style example (Kit Q2, Delta Dec 2019, answer Kit fp.93-94)\n\n```example\n# Exhibit 1, sale with right of return and deferred payment\n1 April 20X7: product sold for $121,000 payable 30 June 20X9. Cost $80,000. Customer may return it until 30 June 20X7 (not returned). Cash price $100,000. Discount rate 10%.\n- 1 April: no revenue, because variable consideration cannot be estimated. Move $80,000 from inventory to a **right-to-recover asset**.\n- 30 June 20X7: uncertainty over returns ends. Recognise revenue of **$100,000** (present value of $121,000 in two years). Transfer $80,000 to cost of sales.\n- Interest income for the year to 30 Sep 20X7: $100,000 x 10% x 3/12 = **$2,500** (operating category).\n- Trade receivable at 30 Sep 20X7: **$102,500**.\n```\n\n```example\n# Exhibit 2, machine plus three years of servicing\nContract price $7.5m. Machine stand-alone price $7m. Servicing costs $200,000 per six months, so $1.2m over 3 years, with a 20% margin: stand-alone price = 1.2 / 0.8 = **$1.5m**.\n```\n\n```split\ntitle: Allocation of $7.5m\nMachine (7 / 8.5) | 6176\nServicing (1.5 / 8.5) | 1324\n```\n\n- Machine revenue **$6.176m** on 1 April 20X7 (delivery).\n- Servicing is recognised evenly over 36 months. Year to 30 Sep 20X7: 1.5/8.5 x 7.5m x 6/36 = **$221,000**.\n- Deferred revenue at year end: 1.5/8.5 x 7.5m x 30/36 = **$1.103m**: current $0.441m (12/30), non-current $0.662m (18/30).\n\n# Common mistakes / أخطاء شائعة\n\n- Listing the five steps with no application (ST p.42, June 2024 examiner's report).\n- Short answers: one well-explained point is worth about one mark, so match the points to the marks (ST p.41, June 2023 examiner's report).\n- Forgetting that a contract with several distinct promises needs the price **allocated by SSP** (Kit Q2).\n- Recognising revenue on consignment goods at delivery.\n- Treating a legally required warranty as a separate performance obligation. It is IAS 37.\n- Showing an agent's gross sales as revenue instead of the commission.\n- Forgetting the financing component when payment is deferred well beyond 12 months (Kit fp.94).\n\n# Exam focus / ما يتكرر في الامتحان\n\n- June 2023 (15-mark requirement): a contract to construct and install complex machinery, a single performance obligation recognised over time (ST p.41).\n- Kit questions that use IFRS 15: Q2 (answer fp.93-94), Q3 (fp.95), Q4 (fp.98), Q9 (fp.112), Q15 (fp.124), Q33 (fp.167), Mock 1 Q4, Mock 2 Q2.\n- ACCA technical article \"Revenue revisited\" and a topic explainer video are on the DipIFR resources page (ST p.40). Not part of the uploaded files.\n\n# Quick review / مراجعة سريعة\n\n```summary\n# Key rules\n- Revenue = transfer of **control**, measured at the transaction price.\n- Five steps: contract, obligations, price, allocation, satisfaction.\n- Distinct goods or services = separate obligations. Allocate by **SSP**.\n- Over time if: simultaneous benefit, customer-controlled asset, or no alternative use plus right to payment.\n- Principal = gross revenue. Agent = commission.\n- Call option or forward: no control transfer. Price at or above original = financing; below = lease.\n- Consignment and bill-and-hold: decide who controls the goods.\n- Contract asset = performance done, payment conditional. Receivable = unconditional. Contract liability = paid before performance.\n```\n", "headings": [{"level": 1, "text": "Overview / نظرة عامة"}, {"level": 1, "text": "Scope and key definitions / النطاق والتعريفات"}, {"level": 1, "text": "The five-step model / نموذج الخطوات الخمس"}, {"level": 2, "text": "Step 1 — The contract (ST p.42, paras. 9-10)"}, {"level": 2, "text": "Step 2 — Performance obligations (ST p.42-43)"}, {"level": 2, "text": "Step 3 — Transaction price (ST p.43-44, paras. 47-72)"}, {"level": 3, "text": "Example A — Volume discount (Taplop, ST p.43-44)"}, {"level": 3, "text": "Example B — Significant financing component (Lansdale, ST p.44)"}, {"level": 2, "text": "Step 4 — Allocation (ST p.45)"}, {"level": 3, "text": "Example C — Free handset (ST p.45)"}, {"level": 3, "text": "Example D — Warranties (Premier Co, ST p.47)"}, {"level": 2, "text": "Step 5 — When is the obligation satisfied? (ST p.45-46)"}, {"level": 1, "text": "Contract costs / تكاليف العقد (ST p.46)"}, {"level": 1, "text": "Common types of transaction / أنواع معاملات شائعة (ST p.47-51)"}, {"level": 2, "text": "Principal or agent? (ST p.48)"}, {"level": 2, "text": "Repurchase agreements (ST p.48-49)"}, {"level": 2, "text": "Consignment (ST p.49-51)"}, {"level": 2, "text": "Bill-and-hold (ST p.51)"}, {"level": 2, "text": "Sale with right of return (ST p.51)"}, {"level": 2, "text": "Warranties (ST p.47)"}, {"level": 1, "text": "Presentation / العرض (ST p.52)"}, {"level": 1, "text": "Calculations / الحسابات"}, {"level": 2, "text": "Example E — Tower block (ST p.52-53)"}, {"level": 2, "text": "Example F — P Co (ST p.54)"}, {"level": 2, "text": "Example G — Santolina Co (ST p.55)"}, {"level": 1, "text": "Past-exam style example (Kit Q2, Delta Dec 2019, answer Kit fp.93-94)"}, {"level": 1, "text": "Common mistakes / أخطاء شائعة"}, {"level": 1, "text": "Exam focus / ما يتكرر في الامتحان"}, {"level": 1, "text": "Quick review / مراجعة سريعة"}]}, {"id": "ifrs/ifrs-9", "section": "ifrs", "title": "IFRS 9 — Financial Instruments / الأدوات المالية", "standard": "IFRS 9", "version": "As taught in BPP DipIFR Study Text 2025-26 (21st ed.), Ch 10", "effective_date": "Mandatory for periods beginning on or after 1 January 2018 (ST p.189)", "source": "Study Text Ch 10 §1, §3-§5 (p.182-221); Kit Q17 (fp.130), Q18 (fp.133), Q23 (fp.144-146), Mock 1 Q1, Q4, Mock 2 Q2, Mock 3 Q3", "body": "\n# Overview / نظرة عامة\n\n```summary\n# الفكرة في سطر واحد\nIFRS 9 يجيب على 4 أسئلة: **متى** أسجّل الأداة المالية؟ **كيف أصنّفها**؟ **بكام أقيسها**؟ **متى أخفض قيمتها** (خسائر ائتمانية متوقعة)؟ مع محاسبة التحوّط كخيار. (ST p.182, p.189)\n```\n\n**Simple explanation.** A financial instrument is a contract that creates a financial asset for one side and a financial liability or equity for the other (a loan, a receivable, a share, a derivative). IFRS 9 says when it goes on the balance sheet, how it is measured afterwards (cost-like or fair value), and when we must record a loss because the other side may not pay.\n\n**Technical explanation.** There are three standards: IAS 32 (liability vs equity, offsetting), IFRS 7 (disclosures, not examinable) and IFRS 9 (recognition, derecognition, measurement, impairment and general hedge accounting) (ST p.182). Classification of a financial asset depends on **both** the business model and the contractual cash flow test (ST p.194).\n\n```flow\nRecognise :: When the entity becomes a party to the contract (ST p.189)\nClassify :: Business model + SPPI test (assets); amortised cost unless FVTPL (liabilities)\nMeasure :: Initial: fair value (+/- transaction costs). Later: amortised cost or fair value\nImpair :: Expected credit losses for assets at amortised cost / FVOCI\nDerecognise :: Rights expire, or risks and rewards pass (assets). Extinguished (liabilities)\n```\n\n# Definitions and derivatives / التعريفات والمشتقات\n\n| Term | العربية | Meaning (own wording, ST p.183) |\n|---|---|---|\n| Financial instrument | أداة مالية | A contract giving a financial asset to one entity and a financial liability or equity to another |\n| Financial asset | أصل مالي | Cash, an equity instrument of another entity, or a contractual right to receive cash or another financial asset |\n| Financial liability | التزام مالي | A contractual obligation to deliver cash or another financial asset |\n| Equity instrument | أداة حقوق ملكية | A residual interest in the assets after deducting all liabilities |\n| Derivative | مشتقة | Value moves with an underlying, little or no initial investment, settled at a future date (all three) |\n\nNot financial instruments (ST p.184): inventories, PPE, intangibles, prepaid expenses, deferred revenue and most warranties. They give goods or services, not cash.\n\n```split\ntitle: Examples of financial instruments (ST p.184)\nFinancial assets: receivables, options, shares held as investments | 50\nFinancial liabilities: payables, loan notes, redeemable preference shares, forward contract at a loss | 50\n```\n\nDerivatives (ST p.185): **forwards**, **futures**, **options**, **swaps**. A derivative is recognised at once even though it costs little or nothing, because the entity is already a party to the contract.\n\n```tip\n# Recognition is different from other standards\nA financial instrument is recognised when you become a party to the contract. A forward contract to buy iron is a financial liability from the commitment date. A plain order for iron is **not**, until delivery. (ST p.189-190)\n```\n\n# Recognition and derecognition / الاعتراف وإلغاء الاعتراف\n\n## Financial assets (ST p.190-193)\n\nAn asset is derecognised when:\n- the contractual rights to the cash flows **expire**, or\n- the entity **transfers** the asset or substantially all the risks and rewards of ownership.\n\n```tree\nRights to cash flows expired?\n  Y: **Derecognise**\n  N: Transferred the rights (or assumed a pass-through obligation)?\n    N: **Keep recognising**\n    Y: Substantially all risks and rewards transferred?\n      Y: **Derecognise**\n      N: Substantially all risks and rewards retained?\n        Y: **Keep recognising**\n        N: Control retained?\n          N: **Derecognise**\n          Y: Recognise only to the extent of continuing involvement\n```\n\n| Transferred (derecognise) | Not transferred (keep) |\n|---|---|\n| Unconditional sale | Sale and repurchase at a fixed price or sale price plus lender's return |\n| Sale plus option to repurchase at fair value | Sale plus a total return swap |\n| | Sale of short-term receivables where the seller guarantees credit losses |\n| | Stock lending (ST p.193) |\n\n```journal\n# Gain or loss on derecognition (ST p.191)\nDr Cash and any new asset received | consideration\nCr Financial asset | carrying amount\nCr/Dr Profit or loss (investing category) | difference\nnote: Carrying amount allocated to the part derecognised, less consideration received.\n```\n\n## Financial liabilities (ST p.193)\n\nDerecognised when **extinguished**: paid, cancelled or expired. A **substantial modification** counts as extinguishment and a new liability: the discounted PV of the new cash flows (at the original EIR) differs by **at least 10%** from the PV of the remaining original cash flows.\n\n### Example A — The 10% test (our own numbers)\n\nRemaining original cash flows have a PV of $1,000,000. After renegotiation the new cash flows, discounted at the original EIR, have a PV of $880,000.\n\n```bars\ntitle: PV of the cash flows ($)\nOriginal terms | 1000000\nNew terms | 880000\n```\n\nDifference = (1,000,000 - 880,000) / 1,000,000 = **12%**, which is at least 10%. So the old liability is extinguished and a new one is recognised at fair value. The difference goes to profit or loss (financing category, ST p.193).\n\n# Classification of financial assets / تصنيف الأصول المالية\n\nTwo tests, both about the **asset** (ST p.194): the **business model** (how management actually manages it, at portfolio level) and the **contractual cash flow** test (solely payments of principal and interest, \"SPPI\").\n\n```tree\nIs it an equity investment?\n  Y: Held for trading?\n    Y: **FVTPL**\n    N: Irrevocable election at initial recognition for FVOCI?\n      Y: **FVOCI (equity)**: only dividends go to profit or loss\n      N: **FVTPL**\n  N: Contractual cash flows solely principal and interest?\n    N: **FVTPL**\n    Y: Business model?\n      Collect only: **Amortised cost**\n      Collect and sell: **FVOCI (debt)**\n      Other: **FVTPL**\n```\n\n```keyterm\n# Fair value option (ST p.195)\nEven if the asset qualifies for amortised cost or FVOCI, it can be designated at FVTPL at initial recognition to remove an **accounting mismatch**. It is irrevocable.\n```\n\n```split\ntitle: How the business model decides (ST p.195-198)\nCollect cash flows (some sales allowed, e.g. credit-rating fall) | 50\nCollect and sell (both integral, e.g. liquidity bank with frequent sales) | 50\n```\n\n- **Collect only** (ST p.195): A Co holds investments to collect cash flows but sells if the credit rating falls or to fund capex. Occasional sales do not change the objective. If sales become frequent, reconsider.\n- **Collect only** (ST p.196): C Co buys loan portfolios, some already credit-impaired, and chases collection. Using swaps to fix the rate does not change the model.\n- **Collect and sell** (ST p.197-198): F Bank holds assets for liquidity needs and sells often and significantly to reinvest. Both collecting and selling are integral.\n\n**SPPI (ST p.196-197).** Interest means time value of money plus credit risk. Pass: fixed, floating, capped floating, or linked to an unleveraged inflation index. **Fail:** a convertible loan (conversion option), or an inverse floating rate (8% minus LIBOR).\n\n## Reclassification (ST p.199)\n\nOnly when the **business model changes**, and prospectively. Not allowed for: a change of intention for particular assets, a temporary market disappearance, or a transfer between parts of the entity with different models. Liabilities are never reclassified. Moving from amortised cost to fair value: the gain or loss goes to profit or loss. Moving from fair value to amortised cost: fair value becomes the new carrying amount.\n\n# Classification of financial liabilities / تصنيف الالتزامات المالية\n\nAll liabilities are at **amortised cost**, except (ST p.198): held for trading, derivatives (not designated hedging instruments), liabilities from failed derecognition, and financial guarantees or below-market loan commitments. A liability can be designated at FVTPL to remove an accounting mismatch.\n\n```warn\n# Credit risk on liabilities at FVTPL (ST p.207)\nWhen a liability is designated at FVTPL, the part of the fair value change due to the entity's **own credit risk** goes to **OCI**. The rest goes to profit or loss. Exception: if this creates or enlarges an accounting mismatch, everything goes to profit or loss.\n```\n\n# Measurement / القياس\n\n```keyterm\n# Amortised cost (ST p.200)\nInitial amount, minus principal repaid, plus or minus the cumulative amortisation (effective interest method) of the difference to the maturity amount, and for assets adjusted for the loss allowance.\n```\n\n**Initial measurement (ST p.200, p.204).** Fair value. **Add** transaction costs for assets at amortised cost or FVOCI. **Deduct** transaction costs for liabilities at amortised cost. For FVTPL items, transaction costs are **expensed**.\n\n```split\ntitle: Transaction costs: where do they go?\nAmortised cost / FVOCI asset: added to cost | 50\nFVTPL asset: expensed immediately | 50\n```\n\n## Example B — Asset at amortised cost (Abacus, ST p.201)\n\nDebt instrument bought 1 Jan 20X1 for $1,000. Principal $1,250, fixed interest 4.72% (= $59 a year), matures 31 Dec 20X5. Effective interest rate 10%.\n\n| Year | Opening | Interest income at 10% | Cash received | Closing |\n|---|---|---|---|---|\n| 20X1 | 1,000 | 100 | (59) | 1,041 |\n| 20X2 | 1,041 | 104 | (59) | 1,086 |\n| 20X3 | 1,086 | 109 | (59) | 1,136 |\n| 20X4 | 1,136 | 113 | (59) | 1,190 |\n| 20X5 | 1,190 | 119 | (1,309) | 0 |\n\n```bars\ntitle: Carrying amount at year end ($)\n20X1 | 1041\n20X2 | 1086\n20X3 | 1136\n20X4 | 1190\n```\n\n```journal\n# 20X1\nDr Cash | 59\nDr Financial asset (unwinding the discount) | 41\nCr Interest income (investing category) | 100\nnote: Income is EIR x opening carrying amount. The cash is the coupon. The difference increases the asset.\n```\n\n## Example C — Liability at amortised cost (Galaxy, ST p.204)\n\nDeep discount bond issued 1 Jan 20X2 for $503,778, no interest, redeemed 31 Dec 20X4 for $600,000. EIR 6%.\n\n```timeline\n31 Dec 20X2 :: 503,778 x 6% = **30,226** finance cost. Carrying amount **534,004** (ST figures).\n31 Dec 20X3 :: 534,004 x 6% = about 32,040. Carrying amount about 566,044 (our derivation).\n31 Dec 20X4 :: about 33,963 finance cost, which brings the liability to $600,000 (small difference is rounding).\n```\n\n```journal\n# 31 December 20X2\nDr Finance cost (financing category) | 30,226\nCr Bond liability | 30,226\nnote: There is no cash interest, so the whole cost increases the liability.\n```\n\n### Example D — Issue costs (Dazzle, ST p.205)\n\n$600,000 loan notes, issue costs $200, no interest, redeemed 31 Dec 20X4 at a premium of $152,389. EIR 12%. Opening liability is **net proceeds $599,800**.\n\n```bars\ntitle: Liability at year end ($)\nStart | 599800\n31 Dec 20X3 | 671776\n31 Dec 20X4 | 752389\n```\n\nFinance cost 20X3 = 599,800 x 12% = **71,976**. Finance cost 20X4 = 671,776 x 12% = **80,613**. Total cost over the life = premium + issue costs (here 152,389 + 200).\n\n## Example E — Equity shares: FVTPL or FVOCI? (Wolf, ST p.202-203)\n\nWolf buys 10 million $1 shares in Hall at $5. Transaction costs $3m. At year end the price is $6.50. Dividend received: $0.20 per share ($2m).\n\n```bars\ntitle: Wolf, shares held for trading: items in profit or loss ($m)\nFair value gain (65 - 50) | 15\nDividend income | 2\nTransaction costs (expense, deducted) | 3\n```\n\n| | (i) Trading (FVTPL) | (ii) FVOCI election |\n|---|---|---|\n| Initial carrying amount | 50 | **53** (50 + 3 costs) |\n| Year end carrying amount | 65 | 65 |\n| Profit or loss | +15 +2 -3 | +2 dividend only |\n| OCI | none | **+12** (65 - 53) |\n\n```trap\n# Common trap\nTransaction costs are **capitalised** only when the asset is **not** at FVTPL. If the election is for FVOCI, the costs go into the carrying amount and the gain in OCI is measured from that higher figure. Dividends are income either way. (ST p.203, Kit fp.130)\n```\n\n## Example F — Kit Q17: Gamma, shares in a key supplier (Kit fp.130)\n\n200,000 shares in entity A, bought 1 Oct 20X6 at a fair value of $2.40 each ($480,000). Broker fee 2%, so Gamma paid $489,600. Year end fair value $2.70. Dividend $50,000 ($0.25 per share). Not held for trading.\n\n```timeline\nInitial :: Fair value $480,000. The $9,600 above fair value is a transaction cost, **expensed** (investing category) under the default FVTPL treatment.\nYear end :: Fair value 200,000 x $2.70 = **$540,000**. Gain **$60,000** to profit or loss. Selling costs are not part of fair value.\nDividend :: $50,000 income in the investing category.\nIf FVOCI election :: Initial carrying amount **$489,600**. OCI gain = 540,000 - 489,600 = **$50,400**. Dividend still in profit or loss.\n```\n\n## Example G — Kit Q18: Delta, option then shares (Kit fp.133)\n\nDelta paid $250,000 for an option on shares in Epsilon. On exercise (31 Dec 20X4) it paid $2m for 1m shares worth $2.60 each. Acquisition costs $100,000. Year end fair value $2.90 each. The shares are a trading portfolio.\n\n```flow\nOption :: A derivative: FVTPL, derecognised on exercise\nShares at exercise :: Fair value 1m x $2.60 = **$2.6m**\nIncome :: 2.6m - (2m + 250,000) = **$350,000** investment income (investing category)\nCosts :: **$100,000** expensed (FVTPL)\nYear end :: Fair value $2.9m, further gain **$300,000** (investing category)\n```\n\n# Impairment: expected credit losses / الانخفاض: الخسائر الائتمانية المتوقعة\n\nForward-looking model (ST p.208). It applies to assets at **amortised cost**, mandatory **FVOCI** debt, lease receivables, **contract assets**, loan commitments and financial guarantees. It does **not** apply to FVTPL assets (the fair value already reflects the loss) (ST p.209).\n\n```tree\nWhere is the asset on the credit curve?\n  Credit risk NOT significantly increased since initial recognition?\n    Y: **Stage 1**: 12-month ECL. Interest on the gross carrying amount.\n    N: Objective evidence of impairment?\n      N: **Stage 2**: lifetime ECL. Interest on the gross carrying amount.\n      Y: **Stage 3**: lifetime ECL. Interest on carrying amount **net** of the allowance.\n```\n\n```keyterm\n# 12-month ECL (ST p.209)\nThe probability of default in the next 12 months multiplied by the **total** lifetime loss that would result from that default. It is **not** the cash shortfall expected in the next 12 months.\n```\n\n- There is a **rebuttable presumption** of a significant increase in credit risk at **30 days past due** (ST p.210).\n- Low credit risk (investment grade) assets do not need lifetime ECL (ST p.210).\n- Stage 1 to 2 and back: if credit quality improves, the 12-month basis is reinstated (ST p.209).\n- Measure as a **probability-weighted** outcome, **discounted**, using reasonable and supportable information (ST p.211).\n- Presentation: credit losses are in the **operating** category for a bank or for trade and lease receivables; for other entities lending is in the **investing** category (ST p.213).\n\n## Example H — Three stages in one loan (Orange, ST p.209-210)\n\nThree-year loan of $2m to Lemon on 1 July 20X4.\n\n| Date | 12-month default risk | Lifetime risk | Loss given default | Allowance | Stage |\n|---|---|---|---|---|---|\n| 1 Jul 20X4 | 2% | 5.5% | 800,000 | 2% x 800,000 = **16,000** | 1 |\n| 31 Dec 20X4 | 3.5% | 10.5% | 750,000 | (3.5% + 10.5%) x 750,000 = **105,000** | 2 |\n| 31 Dec 20X5 | 1.5% | 1% | 450,000 | 1.5% x 450,000 = **6,750** | back to 1 |\n\n```bars\ntitle: Loss allowance ($)\n1 Jul 20X4 | 16000\n31 Dec 20X4 | 105000\n31 Dec 20X5 | 6750\n```\n\nTotal default risk went from 7.5% to 14% (a significant increase), then fell to 2.5% (a significant improvement).\n\n## Example I — Trade receivable with a provision matrix (Kredco, ST p.213-214)\n\nKredco sells to Detco on 1 June 20X4 for $200,000, 60 days credit. Matrix rates used here: not overdue 1%, 1-30 days overdue 5% (higher bands also exist; the text extract of the last band is unclear, so it is not used). Allowance at 1 June = $200,000 x 1% = **$2,000**. By 31 July Detco has used up its credit period and moves to the 5% band.\n\n```journal\n# 1 June 20X4\nDr Trade receivables | 200,000\nCr Revenue | 200,000\nDr Expected credit losses (operating) | 2,000\nCr Allowance for receivables | 2,000\n```\n\n```journal\n# 31 July 20X4\nDr Expected credit losses (operating) | 8,000\nCr Allowance for receivables | 8,000\nnote: Required allowance 200,000 x 5% = 10,000, less 2,000 already held. Good news from Detco's finance controller does not stop the matrix moving.\n```\n\n```warn\n# Exam point\nThe simplified approach (lifetime ECL from day one) applies to trade receivables with no significant financing component. It is also an option for others and for lease receivables (ST p.213).\n```\n\n## Example J — Redblack provision matrix (ST p.214-215)\n\nAt 30 June 20X5 trade receivables are $68m. The matrix:\n\n| Band | Carrying amount $'000 | Rate | Allowance $'000 |\n|---|---|---|---|\n| Current | 32,000 | 0.5% | 160 |\n| 1-30 days | 16,000 | 1.8% | 288 |\n| 31-60 days | 10,000 | 3.8% | 380 |\n| 61-90 days | 7,000 | 7% | 490 |\n| Over 90 days | 3,000 | 11% | 330 |\n| **Total** | 68,000 | | **1,648** |\n\nThe allowance at 30 June 20X4 was $1,160,000, so the increase is **$488,000**.\n\n```journal\n# 30 June 20X5\nDr Expected credit losses (operating) | 488,000\nCr Allowance for receivables | 488,000\n```\n\n## Example K — Undrawn overdraft facilities (Debita, ST p.212)\n\nTotal approved facilities $10m, undrawn. $8m has no significant increase in credit risk, of which $4m is expected to be drawn within 12 months, default probability 3%. On $2m the credit quality has deteriorated and $2m is expected to be drawn over the life, probability 10%.\n\n```split\ntitle: Additional allowance on undrawn facilities ($)\nStage 1: 4m x 3% | 120000\nStage 2: 2m x 10% | 200000\n```\n\nTotal allowance **$320,000**. Only the portion expected to be drawn is used.\n\n# Hedge accounting / محاسبة التحوّط\n\nOptional (ST p.216). The idea: put the gain and loss on the hedged item and the hedging instrument in the **same period**, so only the net effect hits profit.\n\n```flow\nHedged item :: Asset, liability, firm commitment or forecast transaction exposed to risk\nHedging instrument :: Usually a derivative (a non-derivative only for foreign currency risk)\nConditions :: Eligible items, formal documentation at inception, economic relationship, credit risk does not dominate, correct hedge ratio (ST p.217)\nTypes examinable :: **Fair value hedge** and **cash flow hedge**. Net investment hedge is not examinable.\n```\n\n```split\ntitle: Where the gains and losses go\nFair value hedge: instrument to profit or loss, item adjusted and to profit or loss | 50\nCash flow hedge: effective part to OCI (reserve), excess to profit or loss | 50\n```\n\n## Example L — Oil inventory and a futures contract (ST p.217-219)\n\n20,000 gallons of oil cost $400,000. Futures contract to deliver at $22 a gallon on 31 March 20X4. At 31 Dec 20X3 spot is $23 and the futures price is $24.\n\n- Without hedge accounting: loss on the futures 20,000 x (24 - 22) = **$40,000** in profit or loss. Inventory stays at cost.\n- With hedge accounting (fair value hedge): inventory re-measured to 20,000 x 23 = $460,000, gain **$60,000**. Net effect: gain **$20,000** instead of a loss of $40,000 (ST p.218-219).\n\n```journal\n# With hedge accounting, 31 December 20X3\nDr Profit or loss | 40,000\nCr Financial liability (futures) | 40,000\nDr Inventory | 60,000\nCr Profit or loss | 60,000\n```\n\n## Example M — Jules fair value hedge (ST p.219-220)\n\n10,000 ounces cost $200 each ($2m). Sold forward at $210 for 30 June 20X7. At 31 Dec 20X6: fair value $220, futures price $227. At 30 June 20X7 spot is $230 and the position is closed.\n\n```timeline\n31 Dec 20X6 :: Inventory gain 10,000 x (220-200) = **200,000**. Futures liability up 10,000 x (227-210) = **170,000**.\n30 June 20X7 :: Further inventory gain 10,000 x (230-220) = **100,000**. Further futures loss 10,000 x (230-227) = **30,000**.\nSale :: Revenue 2,300,000, cost of sales 2,300,000 (inventory is now 2,300,000). Cash paid to close the futures **200,000**.\nResult :: Profit on the whole transaction is only **$100,000**. Without the forward it would have been $300,000.\n```\n\n```bars\ntitle: Gains and losses over the two periods ($)\nInventory gain | 300000\nFutures loss | 200000\n```\n\n## Example N — Kit Q23: cash flow hedge of a firm commitment (Gamma, Kit fp.144-146)\n\nGamma agrees on 1 January 20X4 to buy a machine from a foreign supplier. It buys a forward to hedge the currency (100% effective). Delivery 30 June 20X4. The forward is a financial asset worth $60,000 at 31 March 20X4, $160,000 at 30 June and $360,000 at 31 July when it is settled.\n\n```timeline\nBefore delivery :: The firm commitment is a non-onerous executory contract: **no liability** until delivery (IAS 37).\n31 Mar 20X4 :: Forward gain **$60,000** to OCI (cash flow hedge reserve), not profit or loss.\n30 Jun 20X4 :: Machine recognised at the spot rate: 14.4m / 9 = **$1.6m**. Further gain of **$100,000** to OCI. The cumulative reserve of **$160,000** is moved straight into the machine: carrying amount **$1.44m**.\n31 Jul 20X4 :: Forward settles for $360,000 (a further $200,000 gain). Payable settled for 14.4m / 8 = $1.8m, so an **exchange loss of $200,000**, and the earlier OCI gain of $200,000 is reclassified to profit or loss.\nDepreciation :: $1.44m x 1/5 x 9/12 = **$216,000** for the year to 31 March 20X5.\n```\n\n```journal\n# 30 June 20X4: transfer of the reserve to the asset\nDr Cash flow hedge reserve | 160,000\nCr Property, plant and equipment | 160,000\nnote: This transfer is not in OCI. It is a reclassification of the amount into the asset's initial cost (IFRS 9 para. 6.5.11, ST p.220).\n```\n\n```warn\n# Why examiners reported low marks (Kit fp.144)\nCandidates recognised the machine too early (at the commitment date), did not explain why the commitment is not recognised, and forgot that the reserve goes into the asset cost, not through OCI again.\n```\n\n# Common mistakes / أخطاء شائعة\n\n- Choosing the classification by management's **intention for one asset** instead of the portfolio business model (ST p.194, p.199).\n- Treating the equity FVOCI election as available **for debt** (it is not, and for debt FVOCI is mandatory if the test is met) (ST p.195).\n- Forgetting that **transaction costs are expensed** at FVTPL but **capitalised** otherwise (ST p.203, Kit fp.130, fp.133).\n- Using 12-month ECL for a loan after a **significant increase** in credit risk (ST p.209).\n- Calculating the 12-month ECL as the expected cash shortfall in 12 months. It is probability of default in 12 months x lifetime loss.\n- Applying the amortised-cost interest to the **closing** balance instead of the **opening** balance.\n- Recognising the **firm commitment** itself in a cash flow hedge (Kit fp.144).\n- Applying ECL to FVTPL assets, which do not need it.\n- Reclassifying liabilities (never allowed) or reclassifying assets without a change in business model.\n\n# Exam focus / ما يتكرر في الامتحان\n\n- June 2024: 10 marks on measurement of financial assets and the meaning of fair value, in answers to a trainee's questions. The examiner noted confusion between assets and liabilities and few references to IFRS 13 (ST p.204).\n- September 2020: a cash flow hedge of a future firm commitment, Question 2. Answers were generally unsatisfactory because candidates did not explain the effect of hedge accounting (ST p.219, Kit Q23).\n- IFRS 9 often appears inside a larger scenario question, so expect calculations (ST p.182).\n- Kit questions: Q7, Q12, Q17, Q18, Q21, Q23, Q46, Mock 1 Q1 and Q4, Mock 2 Q2, Mock 3 Q3. Only Q17, Q18 and Q23 were read in detail for this page; the others are not summarised here.\n- IFRS 7 disclosures are not tested (ST p.223).\n\n# Quick review / مراجعة سريعة\n\n```summary\n# Key rules\n- Recognise when you become **party to the contract** (derivatives too).\n- Derecognise an asset on expiry of cash flows or transfer of **substantially all risks and rewards**. A liability when extinguished; **10% test** for modifications.\n- Debt asset: SPPI + business model = **amortised cost** (collect), **FVOCI** (collect and sell), else **FVTPL**.\n- Equity: always fair value. Not for trading: irrevocable **FVOCI** election, dividends in profit or loss.\n- Liabilities: amortised cost, except FVTPL (held for trading, derivatives, designated). Own credit risk to **OCI**.\n- Transaction costs: **expensed** for FVTPL, **capitalised** otherwise (deducted for liabilities).\n- ECL: 12-month (stage 1), lifetime (stage 2), lifetime on net basis (stage 3). 30 days past due = rebuttable presumption.\n- Hedge: **fair value** hedge adjusts the item and both go to profit or loss. **Cash flow** hedge: effective part to OCI, then into asset cost or reclassified.\n```\n", "headings": [{"level": 1, "text": "Overview / نظرة عامة"}, {"level": 1, "text": "Definitions and derivatives / التعريفات والمشتقات"}, {"level": 1, "text": "Recognition and derecognition / الاعتراف وإلغاء الاعتراف"}, {"level": 2, "text": "Financial assets (ST p.190-193)"}, {"level": 2, "text": "Financial liabilities (ST p.193)"}, {"level": 3, "text": "Example A — The 10% test (our own numbers)"}, {"level": 1, "text": "Classification of financial assets / تصنيف الأصول المالية"}, {"level": 2, "text": "Reclassification (ST p.199)"}, {"level": 1, "text": "Classification of financial liabilities / تصنيف الالتزامات المالية"}, {"level": 1, "text": "Measurement / القياس"}, {"level": 2, "text": "Example B — Asset at amortised cost (Abacus, ST p.201)"}, {"level": 2, "text": "Example C — Liability at amortised cost (Galaxy, ST p.204)"}, {"level": 3, "text": "Example D — Issue costs (Dazzle, ST p.205)"}, {"level": 2, "text": "Example E — Equity shares: FVTPL or FVOCI? (Wolf, ST p.202-203)"}, {"level": 2, "text": "Example F — Kit Q17: Gamma, shares in a key supplier (Kit fp.130)"}, {"level": 2, "text": "Example G — Kit Q18: Delta, option then shares (Kit fp.133)"}, {"level": 1, "text": "Impairment: expected credit losses / الانخفاض: الخسائر الائتمانية المتوقعة"}, {"level": 2, "text": "Example H — Three stages in one loan (Orange, ST p.209-210)"}, {"level": 2, "text": "Example I — Trade receivable with a provision matrix (Kredco, ST p.213-214)"}, {"level": 2, "text": "Example J — Redblack provision matrix (ST p.214-215)"}, {"level": 2, "text": "Example K — Undrawn overdraft facilities (Debita, ST p.212)"}, {"level": 1, "text": "Hedge accounting / محاسبة التحوّط"}, {"level": 2, "text": "Example L — Oil inventory and a futures contract (ST p.217-219)"}, {"level": 2, "text": "Example M — Jules fair value hedge (ST p.219-220)"}, {"level": 2, "text": "Example N — Kit Q23: cash flow hedge of a firm commitment (Gamma, Kit fp.144-146)"}, {"level": 1, "text": "Common mistakes / أخطاء شائعة"}, {"level": 1, "text": "Exam focus / ما يتكرر في الامتحان"}, {"level": 1, "text": "Quick review / مراجعة سريعة"}]}, {"id": "ias/ias-28-ifrs-11-from-kit", "section": "ias", "title": "IAS 28 and IFRS 11 — Associates, Joint Ventures, Joint Operations (from the Kit only)", "standard": "IAS 28; IFRS 11", "version": "As described in BPP DipIFR Exam Practice Kit 2025-26 (17th ed.), for Dec 2025 / Jun 2026 exams", "effective_date": "Not stated in the uploaded documents", "source": "Kit DipIFR Diploma 25-26.md (answers and examiner comments only)", "body": "\n# تنبيه المصدر / Source warning\n\nThis edition of the Study Text has **no chapters** on these topics (the text refers to \"Chapter 23\" and \"Chapter 24\", but the contents page and the PDF end at Chapter 22). The page is built from Kit answers and examiner comments, plus the short Study Text passage on associates in Ch 20 §1.5. It is a **partial** page: it covers what the Kit explains, not the full standards.\nNot covered here because the Kit does not explain them: equity-method detail beyond the points below, loss-making associates, step acquisitions, disposal of an associate, joint-venture disclosures, IFRS 12.\nThe Kit gives no paragraph numbers. The Study Text quotes IAS 28 para. 3, 5 and 6 (see section 1a); no IFRS 11 paragraph numbers appear.\n\nKit page = file page marker (`<!-- page N -->`).\n\n---\n\n# 1. IAS 28 — الشركة الزميلة (Associate)\n\n## 1a. From the Study Text (ST Ch 20 §1.5, p.385–386)\n- Significant influence = power to participate in the investee's financial and operating policy decisions, but not control or joint control (IAS 28 para. 3, quoted at ST p.385).\n- Holding 20% or more of voting power (directly or through subsidiaries) is presumed to give significant influence unless clearly shown otherwise; under 20% presumed not, unless shown otherwise (IAS 28 para. 5, ST p.385).\n- Usual evidence (IAS 28 para. 6, ST p.386): board representation; participation in policy-making; material transactions with the investee; interchange of managerial personnel; provision of essential technical information.\n- IAS 28 requires the equity method for associates (ST p.386). Joint control wording also appears in IAS 24 coverage (ST p.357).\n\n## Significant influence / التأثير الجوهري\n- An investor has an associate when it has significant influence but not control (Kit fp.170, Q34; fp.279, Mock 3 Q4).\n- Presumption: holding **20% or more** of the equity shares gives significant influence. The presumption can be rebutted (Kit fp.170, fp.279).\n- Check control first (IFRS 10). If there is no control, test for significant influence. Examples in the Kit:\n  - 35% of shares + right to appoint 2 of 6 directors → associate, not subsidiary (Kit fp.170).\n  - 40% of shares + right to appoint 4 of 10 directors, no evidence other holders act together against the investor → associate (Kit fp.279).\n\n## Equity method / طريقة حقوق الملكية\n- Measured at **cost**, then adjusted for the investor's **share of the post-acquisition change in the associate's net assets** (Kit fp.170, fp.279).\n- The investor's share of the post-acquisition profit goes to profit or loss; its share of other comprehensive income goes to OCI (Kit fp.170).\n- The carrying amount is **not** the fair value of the shares. Fair value is set by the market (Kit fp.170, fp.279).\n- Required when the investor prepares consolidated financial statements (Kit fp.170).\n\n## Worked pattern from the Kit (Kit fp.193, Q42 Alpha, Dec 2022)\nInvestment in associate (Delta), 25% held:\n\n| Line | $000 |\n|---|---|\n| Cost | 18,000 |\n| 25% × post-acquisition profits (79,000 − 70,000) | 2,250 |\n| **Carrying amount** | **20,250** |\n\nFormula: Carrying amount = Cost + investor % × (associate's net assets now − net assets at acquisition).\n\n## Transactions with the associate / المعاملات مع الزميلة\n- Profits on trading with the associate are eliminated **only to the investor's share** (Kit fp.170).\n- The elimination is made **against the \"investment in associate\"** line, not against inventory or group profit as for a subsidiary (Kit fp.187, examiner comment, Q41).\n- **No** adjustment for cash in transit from an associate, because an associate is not consolidated line by line (Kit fp.187).\n\n## Impairment\n- If the investment is impaired, write it down to its **recoverable amount** (Kit fp.170).\n- Kit fp.193 (Q42) shows an equity-accounted investment alongside an impairment working for another entity; the impairment test for the associate itself is not explained there.\n\n## Tax angle (Kit Q20 Edgworth, June 2016)\n- The question states a 40% associate equity-accounted with carrying value 70m → 75m, and that the local tax only applies when profits are distributed or the investment is sold. The deferred tax answer is in Kit fp.136–139 (Q20 answer). It is an IAS 12 topic and belongs on the IAS 12 page.\n\n## Exam traps (from examiner comments)\n1. Treating an associate like a subsidiary (line-by-line, cash in transit, full unrealised-profit elimination). Kit fp.187.\n2. Forgetting that only the investor's share of unrealised profit is eliminated. Kit fp.187.\n3. Saying \"20% = automatic associate\". It is a rebuttable presumption; look at board seats and other holders. Kit fp.170, fp.279.\n\n---\n\n# 2. IFRS 11 — الترتيبات المشتركة (Joint arrangements)\n\n## Joint control\n- A joint arrangement is one where **two or more parties have joint control** (Kit fp.100; fp.256).\n- Joint control = contractually agreed sharing of control; decisions about the relevant activities need the **unanimous consent** of the parties (Kit fp.256).\n- Typical Kit facts that show joint control: pricing, selling and manufacturing decisions need both parties' agreement (Kit fp.100, fp.131).\n\n## Two types\n| | Joint operation | Joint venture |\n|---|---|---|\n| Parties have | Direct rights to assets and obligations for liabilities | Rights to the **net assets** of the arrangement |\n| Typical sign | No separate entity set up; arrangement is a vehicle for running the investors' own businesses more effectively | A business basically separate from the investors' own businesses |\n| Accounting | Recognise **own share** of assets, liabilities, revenue and expenses | **Equity method**, single line investment |\n| Kit source | fp.100, fp.131, fp.256–257 | fp.256–257 |\n\n(Kit fp.256–257, Mock 2 Q4: investment 1 = joint operation, investment 2 = joint venture.)\n\n## Joint operation — numbers from the Kit\n- Delta/Drax, 50:50 (Kit fp.100, Q4): revenue 40m × 50% = **20m**; cost of sales 26m × 50% = **13m**, both in the operating category of the statement of profit or loss.\n- Gamma/entity B, 50:50 (Kit fp.131, Q17): revenue 22m × 50% = **11m**; irrecoverable debt 100,000 × 50% = **50,000** expense.\n- Mock 2 Q4 (Kit fp.257): cash invested in vehicles → Sinker shows its **share of the vehicles as PPE** and its share of running costs as expenses.\n\n## Joint venture — equity method\n- Investment measured as one amount: investor's share of the net assets, so its share of post-acquisition profit is recognised over the life of the investment (Kit fp.257).\n- Same mechanics as the associate calculation above.\n\n## Exam traps\n1. Calling a no-entity, direct-rights arrangement a \"joint venture\". Examiners noted candidates often failed to explain that the scenario was a joint operation rather than a joint venture (Kit fp.98, examiner comments on Q4).\n2. Using the equity method for a joint operation. Wrong: use line-by-line share.\n3. Writing \"50% of revenue\" in the wrong place. In the Kit answers it sits in the operating category (IFRS 18 presentation).\n\n---\n\n# 3. Comparison / مقارنة\n\n| | Subsidiary (IFRS 10) | Associate (IAS 28) | Joint venture (IFRS 11 + IAS 28) | Joint operation (IFRS 11) |\n|---|---|---|---|---|\n| Test | Control | Significant influence (20%+ presumed) | Joint control, rights to net assets | Joint control, direct rights/obligations |\n| Method | Full consolidation | Equity method | Equity method | Share of each asset, liability, revenue, expense |\n| Unrealised profit | Eliminate in full | Investor's share only, against investment | Same as associate (not stated explicitly in the Kit) | Not explained in the Kit |\n| Cash in transit | Adjust | No adjustment | Not explained in the Kit | Not explained in the Kit |\n\nNote: the equity-method treatment of a joint venture is stated in the Kit (fp.257). The IAS 28 link for a joint venture is not spelled out in the Kit beyond the title \"Investments in Associates and Joint Ventures\".\n\n---\n\n# 4. Practice from the Kit (use the real questions)\n| Topic | Question | Kit file page (answer) |\n|---|---|---|\n| Joint operation, revenue/cost share | Q4 Delta (June 2023) | fp.100 |\n| Joint operation, 50:50 | Q17 Gamma (Dec 2019) | fp.131 |\n| Associate identification + equity method | Q34 Omega (June 2023) | fp.170 |\n| Equity method in consolidated SFP | Q41 Alpha (Dec 2023) | fp.187–188 |\n| Associate carrying amount working | Q42 Alpha (Dec 2022) | fp.193 |\n| JO vs JV | Mock 2 Q4 (Dec 2024) | fp.256–257 |\n| Associate identification | Mock 3 Q4 | fp.279 |\n\n# 5. Quick review\n- Control? → IFRS 10 subsidiary. No control but 20%+ / board influence → associate (rebuttable).\n- Associate = cost + share of post-acquisition net asset change. Not fair value.\n- Unrealised profit with associate: investor's share only, against the investment.\n- Joint control = unanimous consent. Direct rights → joint operation → share of lines. Net assets → joint venture → equity method.\n\n# Sources\n- Kit DipIFR Diploma 25-26.md, answers and examiner comments at the page markers above.\n- Study Text Ch 20 §1.5 and §2.9 mention associates briefly (ST p.385, p.388); no dedicated chapter in the upload.\n", "headings": [{"level": 1, "text": "تنبيه المصدر / Source warning"}, {"level": 1, "text": "1. IAS 28 — الشركة الزميلة (Associate)"}, {"level": 2, "text": "1a. From the Study Text (ST Ch 20 §1.5, p.385–386)"}, {"level": 2, "text": "Significant influence / التأثير الجوهري"}, {"level": 2, "text": "Equity method / طريقة حقوق الملكية"}, {"level": 2, "text": "Worked pattern from the Kit (Kit fp.193, Q42 Alpha, Dec 2022)"}, {"level": 2, "text": "Transactions with the associate / المعاملات مع الزميلة"}, {"level": 2, "text": "Impairment"}, {"level": 2, "text": "Tax angle (Kit Q20 Edgworth, June 2016)"}, {"level": 2, "text": "Exam traps (from examiner comments)"}, {"level": 1, "text": "2. IFRS 11 — الترتيبات المشتركة (Joint arrangements)"}, {"level": 2, "text": "Joint control"}, {"level": 2, "text": "Two types"}, {"level": 2, "text": "Joint operation — numbers from the Kit"}, {"level": 2, "text": "Joint venture — equity method"}, {"level": 2, "text": "Exam traps"}, {"level": 1, "text": "3. Comparison / مقارنة"}, {"level": 1, "text": "4. Practice from the Kit (use the real questions)"}, {"level": 1, "text": "5. Quick review"}, {"level": 1, "text": "Sources"}]}, {"id": "ias/ias-32", "section": "ias", "title": "IAS 32 — Financial Instruments: Presentation / عرض الأدوات المالية", "standard": "IAS 32", "version": "As taught in BPP DipIFR Study Text 2025-26 (21st ed.), Ch 10 §2", "effective_date": "Exact source reference could not be verified from the uploaded document.", "source": "Study Text Ch 10 §2 (p.185-189); Kit Q18, Mock 1 Q4", "body": "\n# Overview / نظرة عامة\n\n```summary\n# الفكرة في سطر واحد\nالأداة المالية تُصنَّف **التزام** أو **حقوق ملكية** حسب **الجوهر** لا الشكل القانوني. العلامة الحاسمة: هل على المصدِر **التزام تعاقدي** بتسليم نقد أو أصل مالي؟ (ST p.186)\n```\n\n**Simple explanation.** If the issuer must hand over cash (or another financial asset), it is a liability. If the issuer has no such duty, it is equity. The label \"share\" does not decide it.\n\n**Technical explanation.** IAS 32's objective is to set principles for presenting instruments as liabilities or equity and for offsetting financial assets and liabilities (ST p.185). Classification is made on initial recognition and is not changed while the instrument is recognised (ST p.186).\n\n```tree\nDoes the issuer have a contractual obligation to deliver cash or another financial asset?\n  Y: **Financial liability**\n  N: Settled in own shares?\n    Fixed amount of cash for a fixed number of own shares?\n      Y: **Equity**\n      N: **Liability** (variable number of shares, or other settlement)\n```\n\n# Liability or equity? / التزام أم حقوق ملكية\n\n| Instrument | Classification | Why (ST p.186) |\n|---|---|---|\n| Redeemable preference shares (fixed date, fixed amount) | **Liability** | Issuer must redeem |\n| Cumulative irredeemable preference shares | **Liability** | Fixed dividends still must be paid later |\n| Ordinary shares | Equity | No obligation to distribute |\n| Share options sold | Not debt | No obligation to deliver cash (ST p.205) |\n\n- **Contingent settlement** (ST p.186): if cash or shares depends on an uncertain event outside both parties' control, treat as a **liability** unless the chance is remote.\n- **Settlement options** (ST p.187): a derivative where one party chooses how to settle is an asset or liability unless every alternative gives equity.\n- **Puttable instruments** (ST p.188-189): a holder's right to put the instrument for cash makes it a liability, but IAS 32 allows equity classification if conditions are met. A duty to pay a pro rata share of net assets only on **liquidation** is equity.\n\n```warn\n# Ability to pay is irrelevant\nIf the issuer cannot pay because of a currency shortage, the obligation still exists and it is still a liability. (ST p.186)\n```\n
