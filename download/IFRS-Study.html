\n# Compound instruments / الأدوات المركبة\n\nConvertible debt has a **liability** part (the debt) and an **equity** part (the holder's conversion option). IAS 32 splits them (ST p.187):\n\n```flow\n1 :: Value the **liability** first: discount the cash flows at the market rate for similar debt **without** conversion\n2 :: Equity = proceeds minus the liability (residual)\n3 :: The split stays fixed even if the chance of conversion changes\n```\n\n## Example A — Rathbone (ST p.187-188)\n\n2,000 bonds issued at par $1,000 ($2m), three-year term, 6% interest paid yearly in arrears. Market rate for similar non-convertible debt 9%. Discount factors at 9%: year 3 = 0.772, annuity for 3 years = 2.531.\n\n```split\ntitle: Splitting $2,000,000 of proceeds ($)\nLiability: PV of principal 1,544,000 + PV of interest 303,720 = 1,847,720 | 1847720\nEquity (balancing figure) | 152280\n```\n\n```journal\n# Issue\nDr Cash | 2,000,000\nCr Financial liability | 1,847,720\nCr Equity (option component) | 152,280\n```\n\n## Example B — EFG hybrid (ST p.206)\n\n10,000 5% convertible bonds at $50 par = $500,000, five years, market rate for similar non-convertible debt 6%. Factors at 6%: principal 0.747, annuity 4.212.\n\n| | $ |\n|---|---|\n| PV of principal 500,000 x 0.747 | 373,500 |\n| PV of interest 25,000 x 4.212 | 105,300 |\n| **Liability component** | **478,800** |\n| **Equity component** (500,000 - 478,800) | **21,200** |\n\n```bars\ntitle: Split of $500,000\nLiability | 478800\nEquity | 21200\n```\n\n```trap\n# Common trap\nThe liability is the **present value of the cash flows at the straight-debt rate**. Do not take the equity as a share of the face value or discount at the coupon rate. (ST p.187)\n```\n\n# Treasury shares, costs and distributions / أسهم الخزينة والتوزيعات\n\n- **Treasury shares:** deducted from equity. No gain or loss in profit or loss on purchase, sale, issue or cancellation (ST p.188).\n- **Interest, dividends, losses and gains** on a liability go to profit or loss (financing category). **Distributions** on equity are debited directly to equity (ST p.188).\n- **Transaction costs** of an equity issue are deducted from equity, usually share premium (ST p.188).\n\n# Offsetting / المقاصة\n\nA financial asset and liability are offset only if the entity (ST p.188):\n- has a **legally enforceable right** of set-off, **and**\n- **intends** to settle net or to realise and settle at the same time.\n\n```tip\n# Both conditions, always\nA legal right alone is not enough, and an intention alone is not enough.\n```\n\n# Common mistakes / أخطاء شائعة\n\n- Calling redeemable or cumulative preference shares **equity** because they are legally \"shares\".\n- Computing the equity part first. IAS 32 values the **liability first** and the equity is the residual (ST p.187).\n- Discounting a convertible at the **coupon** rate instead of the market rate for similar straight debt.\n- Recognising a gain or loss on buying back own shares.\n- Offsetting with a right but no intention to settle net.\n\n# Exam focus / ما يتكرر في الامتحان\n\n- Convertible loans are a regular numerical item inside bigger scenarios (the Kit has several convertible loan exhibits). The individual Kit answers were not read for this page.\n- ACCA's article \"When does debt seem to be equity?\" and a video on debt versus equity are on the DipIFR resources page (ST p.189). Not part of the uploaded files.\n\n# Quick review / مراجعة سريعة\n\n```summary\n# Key rules\n- Obligation to deliver cash = **liability**; no obligation = **equity**. Substance over form.\n- Redeemable and cumulative preference shares are **liabilities**.\n- Convertible bond: **liability first** at the straight-debt market rate; equity is the balance.\n- Treasury shares reduce equity; no profit or loss.\n- Offset only with a **legal right** and the **intention** to settle net.\n```\n", "headings": [{"level": 1, "text": "Overview / نظرة عامة"}, {"level": 1, "text": "Liability or equity? / التزام أم حقوق ملكية"}, {"level": 1, "text": "Compound instruments / الأدوات المركبة"}, {"level": 2, "text": "Example A — Rathbone (ST p.187-188)"}, {"level": 2, "text": "Example B — EFG hybrid (ST p.206)"}, {"level": 1, "text": "Treasury shares, costs and distributions / أسهم الخزينة والتوزيعات"}, {"level": 1, "text": "Offsetting / المقاصة"}, {"level": 1, "text": "Common mistakes / أخطاء شائعة"}, {"level": 1, "text": "Exam focus / ما يتكرر في الامتحان"}, {"level": 1, "text": "Quick review / مراجعة سريعة"}]}, {"id": "glossary/ias-28-ifrs-11-terms", "section": "glossary", "title": "Glossary — Associates and Joint Arrangements / مصطلحات", "standard": "IAS 28; IFRS 11", "version": "", "effective_date": "", "source": "Study Text p.385-386; Kit fp.170, fp.256-257", "body": "\n# Glossary / المصطلحات\n\n| Term | العربية | Meaning (own wording) | Source |\n|---|---|---|---|\n| Associate | شركة زميلة | An entity over which the investor has significant influence but not control. | ST p.385 |\n| Significant influence | تأثير جوهري | Power to take part in the investee's financial and operating policy decisions, without control or joint control. 20% or more of the votes is presumed to give it. | ST p.385 |\n| Equity method | طريقة حقوق الملكية | Investment shown at cost plus the investor's share of the investee's post-acquisition change in net assets. | Kit fp.170 |\n| Joint control | سيطرة مشتركة | Contractually agreed sharing of control; decisions on the relevant activities need unanimous consent. | Kit fp.256 |\n| Joint operation | عملية مشتركة | Parties have direct rights to assets and obligations for liabilities; each recognises its share of the lines. | Kit fp.256-257 |\n| Joint venture | مشروع مشترك | Parties have rights to the net assets; each uses the equity method. | Kit fp.256-257 |\n| Unrealised profit | ربح غير محقق | Profit on trading with the associate not yet earned outside the group; eliminated only to the investor's share. | Kit fp.187 |\n", "headings": [{"level": 1, "text": "Glossary / المصطلحات"}]}, {"id": "sources/curriculum-map", "section": "sources", "title": "IFRS Curriculum Map — خريطة المنهج", "standard": "", "version": "For ACCA DipIFR exams December 2025 and June 2026", "effective_date": "", "source": "BPP DipIFR Study Text 2025-26 (21st ed., June 2025) + BPP DipIFR Exam Practice Kit 2025-26 (17th ed., 2025)", "body": "\n# IFRS Curriculum Map / خريطة المنهج\n\n## 1. Source documents / المصادر\n\n| # | Document | Project path | Size | Pages in file | Edition / validity |\n|---|----------|--------------|------|---------------|--------------------|\n| ST | BPP Study Text, ACCA Diploma in International Financial Reporting | `/mnt/project-files/Study Text DipIFR Diploma 25-26....md` (copy: `uploads/hearth/b7b02a24-...`) | 1.1 MB, 31,430 lines | 484 | 21st edition, June 2025. \"For exams in December 2025 and June 2026\" (ST file p.1, p.2). |\n| Kit | BPP Exam Practice Kit, DipIFR | `/mnt/project-files/Kit DipIFR Diploma 25-26.md` (copy: `uploads/hearth/4d494822-...`) | 0.7 MB, 19,766 lines | 280 | 17th edition, 2025. \"For exams in December 2025 and June 2026\" (Kit file p.1, p.2). 46 practice questions + 3 mock exams (June 2024, December 2024, Specimen amended). |\n\n**Page reference convention used in this project**\n- **ST p.X** = printed page number of the Study Text. The file's `<!-- page N -->` marker = printed page + 20 (checked at every chapter start, e.g. Ch 3 Revenue: printed 39 = file marker 59).\n- **Kit fp.X** = the Kit file's `<!-- page N -->` marker (printed page numbers in the Kit are inconsistent after OCR, so file markers are used).\n- Both files are OCR conversions of PDFs. Some characters are corrupted (e.g. \"I\" for \"1\", \"Bl O\" for \"B10\", \"ß\" in words). Paragraph references inside the text (e.g. \"IFRS 18: para. 47\") can be cited, but each must be checked against the text when used.\n\n---\n\n## 2. Exam facts stated in the documents / معلومات الامتحان\n\n| Fact | Source |\n|------|--------|\n| Computer-based exam, 3 hours 15 minutes, 4 compulsory questions × 25 marks, pass mark 50% | ST file p.7 (\"Approach to examining the syllabus\"); Kit fp.11 |\n| Q1 = consolidated financial statements (often with adjustments to the parent's own statements first) | ST file p.7 |\n| Q2 = scenario on accounting treatment + an **ethics component, maximum 5 marks** | ST file p.7; ST Ch 1 intro (ST p.3) |\n| Q3 = usually one specific IFRS (principles + application) | ST file p.7 |\n| Q4 = queries from a superior; rarely numerical | ST file p.7 |\n| Examinable documents are those issued before 31 August 2024 for the Dec 2025 / Jun 2026 sittings; documents can be examinable before their effective date | ST file p.7 |\n\n---\n\n## 3. Examinable documents (per ST file p.8–9) / المعايير المقررة\n\nIAS 2, 8, 10, 12, 16, 19, 20, 21, 23, 24, 27, 28, 32, 33, 36, 37, 38, 40, 41;\nIFRS 2, 3, 5, 6, 8, 9, 10, 11, 12, 13, 15, 16, 18, 19; IFRS for SMEs;\nIFRS S1, IFRS S2; Conceptual Framework; IESBA Code of Ethics Part 1 (Sections 100, 110–115, 120).\n\nNot on the list (so treated as non-examinable): IAS 1 (replaced by IFRS 18), IAS 7, IAS 29, IAS 34, IFRS 7 (but see conflict C5), IFRS 17, IFRS 1.\n\n---\n\n## 4. Curriculum map by standard / الخريطة حسب المعيار\n\nLegend for Kit coverage: number = Kit practice question; **M1/M2/M3** = mock exam and question number. Kit tags were found by scanning each question and answer for standard references, then checked by question topic headings in the Kit index (Kit fp.5–7).\n\n### Part A — International sources of authority\n\n| Standard / topic | ST chapter & sections (printed page) | Version / dates stated in the documents | Kit questions |\n|---|---|---|---|\n| IASB, IFRS Foundation, standard-setting process | Ch 1 §1–3 (p.3) | IFRS 1 issued 2003; standards after that are \"IFRS\" (ST Ch 1 §2.1) | 1 |\n| IFRS S1 & IFRS S2 (ISSB) | Ch 1 §4 (p.3 onwards) | ISSB formed 2021; S1 & S2 issued June 2023, effective periods from 1 Jan 2024, early adoption allowed if both applied together (ST p.9) | — |\n| Ethics (IESBA Code Part 1) | Ch 1 §5 (Section 120 conceptual framework at §5.1.3) | Up to 5 marks in Q2 every exam | Ethics marked (*) in Kit index: 5, 6, 7, 18, 23, 33; all mock Q2s |\n| Conceptual Framework | Ch 2 §1–11 (p.19) | Revised and reissued 2018 (ST p.21); IAS 37 and IAS 38 still use 2010 asset/liability definitions (ST Ch 2 §11) | 1 |\n\n### Part B — Elements of financial statements\n\n| Standard | ST chapter & sections (printed page) | Version / dates stated | Kit questions |\n|---|---|---|---|\n| **IFRS 15** Revenue | Ch 3 (p.39): §1 scope/definitions p.40; §2 five steps p.42–46 (contract, POs, price p.43, allocation p.45, over time/point in time p.46); §3 warranties, principal/agent, repurchase, consignment, bill-and-hold, returns p.47–51; §4 presentation p.52; §5 contracts over time p.52–54 | Issued May 2014, joint IASB/FASB project (ST p.40) | 2, 3, 4, 9, 15, 33; M1-Q4; M2-Q2 |\n| **IAS 16** PPE | Ch 4 §1 (p.60–68): recognition, components, initial cost, revaluation model p.64, depreciation p.66, derecognition p.68; §2 depreciation p.69 | — | 5, 6, 7, 8, 12, 24, 29; M1-Q3; M3-Q2 |\n| IAS 20 Government grants | Ch 4 §3 (p.74–78) | — | 13 |\n| IAS 40 Investment property | Ch 4 §4 (p.79–82): cost vs FV model, transfers p.82 | — | 8, 9, 36 |\n| IAS 23 Borrowing costs | Ch 4 §5 (p.83) | — | 5, 7 |\n| **IAS 36** Impairment | Ch 5 (p.91): §1 indicators, recoverable amount, VIU p.92–95; §2 CGUs p.95; §3 goodwill allocation and testing p.97–98; §4 allocation of loss and reversal p.99–100 | — | 21, 24, 33, 35, 37; consolidation Qs 39, 42, 43, 44, 46; M1-Q1; M2-Q1, M2-Q3 |\n| **IFRS 16** Leases | Ch 6 (p.105): §1 identifying a lease, exemptions p.106–109; §2 lessee liability/ROU, finance charge p.110–114; §3 sale and leaseback p.116–121; §4 lessor, finance/operating, subleases p.121–124 | Sept 2020 exam Q4 tested lessee ROU explanation (ST Ch 6 exam focus) | 1, 3, 10, 18; M1-Q2; M3-Q2 |\n| IAS 38 Intangibles | Ch 7 §1–2 (p.128–134): identifiability, R&D p.130, subsequent measurement, useful life p.133 | Keeps 2010 Framework asset definition (ST Ch 2 §11) | 8, 11, 12, 22, 24, 28, 34, 37; M1-Q3; M2-Q4 |\n| **IFRS 3** Business combinations (goodwill) | Ch 7 §3 (p.135–136); Ch 21 §4 goodwill & NCI p.405–414, §10 fair values in acquisition accounting p.429–434 | — | 8, 28, 37; all consolidation Qs 38–46; M2-Q2 |\n| **IAS 37** Provisions & contingencies | Ch 8 (p.141): §1 recognition, measurement, specific provisions p.142–145; §2 restructuring p.147; §3 contingent liabilities/assets, flow chart p.148–149 | Keeps 2010 Framework liability definition (ST Ch 2 §11) | 3, 6, 7, 13, 23, 28; M1-Q3; M1-Q4 |\n| IAS 19 Employee benefits | Ch 9 (p.155): short-term p.158; DC/DB p.159–173 (projected unit credit p.163, net interest p.165, remeasurements p.166, past service and asset ceiling p.168–169); other long-term p.174; termination p.175 | Narrow-scope amendment 2018 (plan amendment, curtailment, settlement) (ST p.156, §6.1 p.168) | 12, 14, 15, 16 |\n| **IFRS 9 / IAS 32** Financial instruments | Ch 10 (p.181): §1 definitions, derivatives p.182–185; §2 IAS 32 liability vs equity, compound instruments, treasury shares, offsetting p.185–188; §3 recognition, derecognition, classification p.189–199; §4 amortised cost/EIR, FVTPL/FVOCI, liabilities, ECL model p.200–208; §5 hedge accounting (fair value and cash flow only examinable) p.216–218 | IFRS 9 mandatory for periods from 1 Jan 2018 (ST p.189) | 7, 12, 17, 18, 21, 23, 46; M1-Q1, M1-Q4; M2-Q2; M3-Q3 |\n| IFRS 7 Disclosures | Ch 10 §6 (p.223) | See conflict C5 | — |\n| IFRS 13 Fair value | Ch 10 §7 (p.224–227) | — | 8, 9, 17, 22; M1-Q4; M2-Q2; M3 (11 refs) |\n| **IAS 12** Income taxes | Ch 11 (p.231): §1 current tax p.232–234; §2 deferred tax, tax base, temporary differences p.234–243; §3 DT in business combinations, undistributed profits, URP p.243–245; §4 sales tax/VAT p.246–247 | Tax charge shown in \"income taxes\" category under IFRS 18 (ST Ch 11) | 19, 20, 21, 25, 29; ST Ch 14 §2 (DT on share-based payment) |\n| IAS 21 Foreign currency (individual entity) | Ch 12 (p.251): transactions, monetary/non-monetary at year end p.254–255; functional currency p.256–258 | — | 22, 23, 26; M2-Q3 |\n| IAS 41 Agriculture | Ch 13 §1 (p.262–267) | — | 25, 26; M2-Q4; M3 |\n| IFRS 6 Mineral resources | Ch 13 §2 (p.268–270) | — | 24, 31; M2-Q4 |\n| IAS 2 Inventories | Ch 13 §3 (p.271–274) | — | 12, 16, 25, 26; M2-Q3, M2-Q4; M3-Q4 |\n| IFRS 2 Share-based payment | Ch 14 (p.279): equity-settled p.283, modification p.286, cancellation p.287, cash-settled p.289, choice of settlement p.291; DT p.292–293 | — | 27, 28, 29, 30, 35; M1-Q2 |\n\n### Part C — Presentation and disclosures\n\n| Standard | ST chapter & sections (printed page) | Version / dates stated | Kit questions |\n|---|---|---|---|\n| **IFRS 18** Presentation & Disclosure | Ch 15 (p.299): §1 objective, roles, aggregation p.300–301; §2 P/L categories (operating, investing, financing), main business activity, OCI p.302–306; §3 current/non-current p.307–309; §4 SOCE p.310; §5 notes p.311; §6 fair presentation p.317 | Issued 2024, replaces IAS 1, **effective for periods starting on or after 1 January 2027**, examinable in DipIFR from December 2025 (ST p.300) | 13, 24, 36; M3-Q4 |\n| IAS 8 Basis of Preparation | Ch 16 §1–3 (p.322–326): policies, changes, estimates, errors | Title in documents: \"Basis of Preparation of Financial Statements\" (renamed standard) | M1-Q2; M3-Q4 |\n| IFRS 5 Held for sale & discontinued ops | Ch 16 §4 (p.328–332) | — | 6, 18, 24, 30, 35 |\n| IAS 10 Events after reporting period | Ch 16 §5 (p.333–335) | — | 12, 16, 26, 31; M1-Q3 |\n| IAS 33 EPS | Ch 17 (p.339): basic p.341, bonus/rights issues p.343–346, diluted p.347–351 | — | 13, 32, 33 |\n| IAS 24 Related parties | Ch 18 §1 (p.356–358) | — | 10, 22, 28, 34 |\n| IFRS 8 Operating segments | Ch 18 §2 (p.361–363) | — | 10, 13, 35, 36; M1-Q4 |\n| IFRS for SMEs | Ch 19 (p.369): background, scope, omitted topics, simplifications p.370–376 | 1st ed. 2009, 2nd ed. 2015; ST says 3rd ed. \"due to be issued in February 2025\" (ST p.372) — see conflict C3 | 37 |\n| IFRS 19 Subsidiaries without public accountability | Ch 20 §2.10 (p.389) | Effective periods from 1 January 2027, early adoption permitted, examinable from December 2025 (ST p.389) | 11, 35 |\n\n### Part D — Group accounts\n\n| Standard / topic | ST chapter & sections (printed page) | Kit questions |\n|---|---|---|\n| IFRS 10 control, group definition, exemptions | Ch 20 (p.383): §1 definitions p.384–385; §2 power/returns, exemptions, reporting dates, uniform policies p.386–389; §3 structure p.390; §4 related parties p.391 | 34, 36 |\n| Consolidated SFP (NCI, goodwill, URP, intra-group PPE, mid-year acquisition, fair values) | Ch 21 (p.395): §1 p.397; §2 NCI p.401; §4 goodwill p.405–414 (full/partial goodwill, bargain purchase, consideration types); §5 URP p.419; §6 p.424; §8 p.426; §9 disposals p.429; §10 fair values p.429–434 | 38, 39, 40, 41, 42; M1-Q1; M3-Q1 |\n| Consolidated P/L & OCI, disposal of subsidiary, SOCE | Ch 22 (p.441): §1 p.442–450; §2 OCI p.450–452; §3 disposal p.454–457; §4 SOCE p.459–461 | 43, 44, 45, 46; M2-Q1 |\n| IAS 28 associates & joint ventures | **Ch 23 referred to in the text but not included in this edition** (see C1). Only brief mentions in Ch 20 §1.5 (p.385) and §2.9 (p.388) | 34 (IAS 28 refs); M3 (IAS 28 refs) |\n| IFRS 11 joint arrangements | **Ch 24 referred to in the text but not included in this edition** (see C1). Brief mention ST p.357–358 | 4, 17; M2-Q4 |\n| IAS 27 separate FS; IFRS 12 disclosures | No dedicated chapter in the uploaded file; IFRS 12 mentioned twice (ST p.358) | — |\n\n---\n\n## 5. Conflicts, gaps and warnings / التعارضات والملاحظات\n\n| # | Issue | Evidence | Effect on the website |\n|---|-------|----------|-----------------------|\n| C1 | **Chapters 23 (associates) and 24 (joint arrangements) are not in this Study Text.** The printed contents (ST p.iii) lists only 22 chapters, and the supplied PDF `Study Text DipIFR Diploma 25-26.pdf` has the same 484 pages as the Markdown file (checked: contents page and last page 464 = end of Ch 22). So this is not a truncated upload. The text still refers readers to \"Chapter 23\" (ST p.386) and \"IFRS 11: Chapter 24\", and the exam-analysis grid lists those topics, but no such chapters exist in this copy. The practice question bank and index are also absent. | ST p.iii; ST p.386; ST file p.10; PDF page count 484 | IAS 28 and IFRS 11 can only be sourced from ST Ch 20 §1.5 (p.385–386), ST p.357 (definitions), and the Kit. Pages must be marked partial. A different edition or the separate chapters would be needed for full detail. |\n| C2 | **Edition covers Dec 2025 and June 2026 only.** The user's exam is June 2027, which falls under a later examinable-documents list (cut-off around 31 Aug / 1 Sep 2025 per the stated rule). | ST file p.1, p.7; Kit fp.1 | Any standard or amendment issued between Sept 2024 and Aug 2025 is **not** in these documents. Exact source reference could not be verified from the uploaded document. Check ACCA's DipIFR examinable documents for June 2027 before finalising pages. |\n| C3 | IFRS for SMEs 3rd edition is described as \"due to be issued in February 2025\" (future tense at print). | ST p.372 | Its final content and effective date are not in the documents; the SME page must say so. |\n| C4 | Cut-off wording differs: ST says regulations \"issued by 31 August\"; Kit says \"issued by 1 September\". | ST file p.7; Kit fp.11 | Minor; practically the same date. Note only. |\n| C5 | IFRS 7 is taught (ST Ch 10 §6) but is **not** on the ST's examinable documents list. | ST file p.8 vs Ch 10 §6 | Treat IFRS 7 as background, not a priority exam topic. |\n| C6 | IFRS 18 replaces IAS 1. Both documents consistently use IFRS 18 (no IAS 1 references in the Kit; ST mentions IAS 1 only as the replaced standard). Old exam questions in the Kit are marked \"(amended)\" where updated. | grep of both files | No conflict, but all website pages must present P/L using IFRS 18 categories. Practical note for Egypt: local statements under Egyptian Accounting Standards are outside these documents, so any EAS comparison must come from another source. |\n| C7 | OCR quality: the ST \"Analysis of past exams\" grid (file p.10) is unreadable, so topic frequency per sitting cannot be extracted. Some text has character errors. | ST file p.10 | Exam-frequency claims on the website will rely on Kit question dates instead. |\n\nNo direct contradiction on any accounting requirement was found between the ST and the Kit in this pass. Requirement-level checks will be done standard by standard when each page is written.\n\n---\n\n## 6. Proposed priority order for the standard pages / ترتيب الأولوية المقترح\n\nBased on: (a) relevance to an external auditor in Egypt (as requested), (b) exam weight (Q1 is always consolidation = 25%), (c) number of Kit questions.\n\n**Wave 1 — core (auditor + exam)**\n1. IFRS 15 Revenue (Ch 3; 8 Kit/mock questions)\n2. IFRS 9 + IAS 32 + IFRS 13 Financial instruments & fair value (Ch 10; 11+ questions)\n3. IFRS 16 Leases (Ch 6; 6 questions)\n4. IFRS 3 + IFRS 10 Business combinations and consolidation (Ch 7 §3, Ch 20–22; Q1 of every exam, 14+ questions)\n5. IAS 12 Income taxes (Ch 11; 5 questions)\n6. IAS 36 Impairment (Ch 5; 13 questions incl. consolidation)\n7. IAS 37 Provisions (Ch 8; 8 questions)\n\n**Wave 2 — high exam frequency**\n8. IFRS 18 Presentation (new; effective 1 Jan 2027)\n9. IAS 16 / IAS 23 / IAS 20 / IAS 40 (Ch 4)\n10. IAS 38 Intangibles (Ch 7)\n11. IAS 19 Employee benefits (Ch 9)\n12. IAS 8 / IFRS 5 / IAS 10 (Ch 16)\n13. IFRS 2 Share-based payment (Ch 14)\n14. IAS 21 Foreign currency (Ch 12)\n15. IAS 33 EPS (Ch 17)\n\n**Wave 3 — lower weight**\n16. IAS 2, IAS 41, IFRS 6 (Ch 13)\n17. IAS 24, IFRS 8 (Ch 18)\n18. IFRS for SMEs, IFRS 19 (Ch 19, Ch 20 §2.10)\n19. Conceptual Framework, IASB/ISSB (IFRS S1/S2), Ethics (Ch 1–2)\n\n**Partly covered:** IAS 28 and IFRS 11 have a Kit-only page at `ifrs-study/ias/ias-28-ifrs-11-from-kit.md`. **Still limited because this edition has no chapters on them:** full IAS 28/IFRS 11 detail, IAS 27, IFRS 12 (C1).\n\n---\n\n## 7. Coverage check of this map / تدقيق التغطية\n\n| Check | Result |\n|---|---|\n| Both uploaded documents analysed | Yes (ST: all 484 file pages present; Kit: 280 file pages, ends inside Mock 3 answers) |\n| Every examinable standard on the ST list located | Yes, except IAS 27, IAS 28, IFRS 11, IFRS 12 (only partial references; no dedicated chapters in this edition) |\n| Versions / effective dates recorded | Only where the documents state them (IFRS 15, IFRS 9, IFRS 18, IFRS 19, IFRS S1/S2, IAS 19 amendment, Conceptual Framework, IFRS for SMEs) |\n| Invented references | None. Where not verifiable, the map says so. |\n", "headings": [{"level": 1, "text": "IFRS Curriculum Map / خريطة المنهج"}, {"level": 2, "text": "1. Source documents / المصادر"}, {"level": 2, "text": "2. Exam facts stated in the documents / معلومات الامتحان"}, {"level": 2, "text": "3. Examinable documents (per ST file p.8–9) / المعايير المقررة"}, {"level": 2, "text": "4. Curriculum map by standard / الخريطة حسب المعيار"}, {"level": 3, "text": "Part A — International sources of authority"}, {"level": 3, "text": "Part B — Elements of financial statements"}, {"level": 3, "text": "Part C — Presentation and disclosures"}, {"level": 3, "text": "Part D — Group accounts"}, {"level": 2, "text": "5. Conflicts, gaps and warnings / التعارضات والملاحظات"}, {"level": 2, "text": "6. Proposed priority order for the standard pages / ترتيب الأولوية المقترح"}, {"level": 2, "text": "7. Coverage check of this map / تدقيق التغطية"}]}], "questions": [{"id": "q-ias28-001", "standard": "IAS 28", "topic": "Significant influence", "difficulty": "easy", "question": "Zeta holds 30% of the voting shares of Yara and can appoint 2 of Yara's 7 directors. No other shareholder acts together with Zeta or against it, and Zeta does not control Yara. How should Zeta classify the investment in its consolidated financial statements?", "options": ["Subsidiary, consolidated line by line", "Associate, equity method", "Financial asset under IFRS 9 at fair value", "Joint venture, equity method"], "answer": 1, "explanation": "30% is above the 20% presumption and board representation is evidence of significant influence, with no control shown. That makes Yara an associate, accounted for by the equity method.", "why_wrong": ["Control is not shown by 30% of shares and 2 of 7 directors.", "An investment with significant influence is not a simple financial asset.", "A joint venture needs joint control (unanimous consent of the parties), which the facts do not describe.", ""], "source": "Kit fp.170 (Q34 answer) and fp.279 (Mock 3 Q4); ST p.385-386. Scenario written for this site."}, {"id": "q-ias28-002", "standard": "IAS 28", "topic": "Equity method calculation", "difficulty": "medium", "question": "On 1 January 20X1 Alfa bought 30% of Beta for $12m. Beta's net assets were $30m then and $38m at 31 December 20X1. There is no impairment. What is the carrying amount of the investment in Beta at 31 December 20X1?", "options": ["$12.0m", "$14.4m", "$11.4m", "$8.0m"], "answer": 1, "explanation": "Carrying amount = cost + investor % x change in net assets since acquisition = 12.0 + 30% x (38 - 30) = 12.0 + 2.4 = $14.4m.", "why_wrong": ["Cost alone ignores the share of post-acquisition profit.", "30% x 38 = 11.4 ignores the cost paid and the premium over net assets.", "8.0 is the full change in net assets, not Alfa's 30% share.", ""], "source": "Method from Kit fp.170 and fp.193 (Q42 working: cost + share of post-acquisition change). Numbers written for this site."}, {"id": "q-ifrs11-001", "standard": "IFRS 11", "topic": "Joint operation accounting", "difficulty": "medium", "question": "Delta and Drax agree to manufacture a product together. All key decisions need both parties' consent. No separate entity is set up, and each party has rights to the assets and obligations for the liabilities of the arrangement. Total revenue is $60m, shared 50:50. What does Delta recognise for revenue?", "options": ["$60m, as it consolidates the arrangement", "$30m, its share, as part of a joint operation", "$0 until the arrangement is wound up", "$30m shown as a single line 'investment' under the equity method"], "answer": 1, "explanation": "Joint control exists (unanimous consent) and the parties have direct rights and obligations, so it is a joint operation. Each party recognises its own share of assets, liabilities, revenue and expenses: 50% x 60m = $30m revenue.", "why_wrong": ["Neither party controls the arrangement alone, so full consolidation is wrong.", "", "Revenue is recognised as it arises; nothing waits for a wind-up.", "The equity method with one investment line is for a joint venture, not a joint operation."], "source": "Kit fp.100 (Q4 answer) and fp.131 (Q17 answer). Numbers written for this site."}, {"id": "q-ias28-003", "standard": "IAS 28", "topic": "Unrealised profit with an associate", "difficulty": "hard", "question": "Omega owns 40% of Sigma, an associate. During the year Omega sold goods that cost it $60,000 to Sigma for $100,000. All the goods are still in Sigma's inventory at the year end. How is the unrealised profit dealt with in Omega's consolidated statements?", "options": ["$40,000 is deducted from group inventory", "$16,000 (40% x $40,000) is eliminated against the investment in associate", "$16,000 is eliminated against group inventory", "No adjustment, because an associate is not consolidated"], "answer": 1, "explanation": "Profit on trading with an associate is eliminated only to the investor's share: 40% x (100,000 - 60,000) = $16,000, and the adjustment goes against the investment in associate (equity method), not against inventory.", "why_wrong": ["Eliminating 100% and against inventory treats the associate like a subsidiary.", "", "Only the share is eliminated, but the credit side is the investment in associate, not group inventory.", "An adjustment is required; it is just limited to the investor's share."], "source": "Kit fp.187 (examiner comment on Q41) and fp.170 (Q34 answer). Numbers written for this site."}, {"id": "q-ias32-001", "standard": "IAS 32", "topic": "Liability or equity", "difficulty": "easy", "question": "An entity issues preference shares that must be redeemed in five years at a fixed amount. How are they classified?", "options": ["Equity, because they are shares", "Financial liability", "Part equity, part liability", "Not recognised"], "answer": 1, "explanation": "The issuer has a contractual obligation to deliver cash at a fixed date, so it is a liability whatever the legal form.", "why_wrong": ["Legal form does not decide; substance does.", "", "There is no equity feature to split.", "All financial instruments are recognised when the entity becomes a party."], "source": "ST p.186 Scenario and numbers written for this site."}, {"id": "q-ias32-002", "standard": "IAS 32", "topic": "Liability or equity", "difficulty": "medium", "question": "Cumulative irredeemable preference shares carry a fixed dividend. Insufficient profits mean the dividend is missed this year. How are they classified?", "options": ["Equity, because they are never redeemed", "Liability, because the missed dividend must still be paid later", "Equity until the dividend is missed", "Liability only in the year the dividend is missed"], "answer": 1, "explanation": "The cumulative dividend is an unavoidable obligation, so the instrument is a liability.", "why_wrong": ["No redemption does not remove the dividend obligation.", "", "Classification is fixed at initial recognition.", "Classification is made at issue, not year by year."], "source": "ST p.186 Scenario and numbers written for this site."}, {"id": "q-ias32-003", "standard": "IAS 32", "topic": "Compound instruments", "difficulty": "medium", "question": "How does IAS 32 split a convertible bond?", "options": ["Equity first, liability as the balance", "Liability first at the market rate for similar debt without conversion; equity as the balance", "Half and half", "All as a liability until conversion"], "answer": 1, "explanation": "The liability is valued first by discounting at the rate for similar straight debt. Equity is the residual.", "why_wrong": ["The standard works the other way round.", "", "Splits are not arbitrary.", "The conversion option is an equity component."], "source": "ST p.187 Scenario and numbers written for this site."}, {"id": "q-ias32-004", "standard": "IAS 32", "topic": "Compound instruments", "difficulty": "hard", "question": "A company issues 5,000 convertible bonds at par $100 ($500,000), 4% interest paid yearly in arrears, repayable in 3 years. The market rate for similar non-convertible debt is 8%. Discount factors at 8%: year 3 = 0.794, 3-year annuity = 2.577. What is the equity component?", "options": ["$448,540", "$51,540", "$51,460", "$100,000"], "answer": 2, "explanation": "Liability = 500,000 x 0.794 = 397,000, plus interest 20,000 x 2.577 = 51,540, total 448,540. Equity = 500,000 - 448,540 = 51,460.", "why_wrong": ["That is the liability component.", "That is only the present value of the interest.", "", "No basis in the figures."], "source": "ST p.187-188 Scenario and numbers written for this site."}, {"id": "q-ias32-005", "standard": "IAS 32", "topic": "Treasury shares", "difficulty": "easy", "question": "An entity buys back some of its own shares for cash. What is the accounting?", "options": ["Recognise a gain in profit or loss if the price is low", "Deduct the cost from equity; no profit or loss", "Recognise an asset", "Recognise a financial liability"], "answer": 1, "explanation": "Treasury shares are deducted from equity, and no gain or loss goes to profit or loss.", "why_wrong": ["No gain or loss is ever recognised on own shares.", "", "Own shares are not an asset.", "There is no obligation to pay anyone afterwards."], "source": "ST p.188 Scenario and numbers written for this site."}, {"id": "q-ias32-006", "standard": "IAS 32", "topic": "Offsetting", "difficulty": "medium", "question": "Entity A has a receivable of $80,000 and a payable of $60,000 with the same bank. It has a legally enforceable right to set off but intends to settle each separately. How are they presented?", "options": ["Net $20,000 asset", "Gross: $80,000 asset and $60,000 liability", "Net, because the legal right exists", "Not presented"], "answer": 1, "explanation": "Both a legal right and an intention to settle net (or simultaneously) are needed. The intention is missing.", "why_wrong": ["Needs the intention as well.", "", "A legal right alone is not enough.", "Financial assets and liabilities are always presented."], "source": "ST p.188 Scenario and numbers written for this site."}, {"id": "q-ias32-007", "standard": "IAS 32", "topic": "Contingent settlement", "difficulty": "hard", "question": "An instrument requires the issuer to pay cash if an uncertain event outside both parties' control occurs, otherwise to issue shares. The event is possible, not remote. How is it classified?", "options": ["Equity", "Financial liability", "Equity for now, reviewed each year", "A provision under IAS 37"], "answer": 1, "explanation": "With a contingent settlement feature that is not remote, the instrument is a financial liability.", "why_wrong": ["Equity classification applies only when settlement in cash is remote.", "", "Classification is made at initial recognition.", "It is a financial instrument, so IAS 32 applies."], "source": "ST p.186 Scenario and numbers written for this site."}, {"id": "q-ias32-008", "standard": "IAS 32", "topic": "Transaction costs", "difficulty": "medium", "question": "Where are the transaction costs of issuing equity shares normally recorded?", "options": ["Expense in profit or loss", "Deducted from equity, usually share premium", "Added to the liability", "Capitalised as an intangible asset"], "answer": 1, "explanation": "Costs of an equity transaction are a deduction from equity.", "why_wrong": ["They are not an expense.", "", "Equity issuance costs do not relate to a liability.", "They do not create an intangible asset."], "source": "ST p.188 Scenario and numbers written for this site."}, {"id": "q-ifrs15-001", "standard": "IFRS 15", "topic": "Performance obligations", "difficulty": "easy", "question": "Alfa sells an accounting software licence together with one year of helpdesk support in a single contract. Other firms also offer helpdesk support for the software, and the software works fully without it. How many performance obligations does the contract contain?", "options": ["One, because there is a single contract", "Two, because each promise is distinct", "Three, one for the contract and one for each promise", "None until the support year ends"], "answer": 1, "explanation": "Each promise is capable of being distinct (the software works alone, support is available from others) and is separately identifiable in the contract. Two distinct promises are two performance obligations.", "why_wrong": ["The number of contracts does not decide the number of obligations; distinct promises do.", "", "A contract is not itself an obligation.", "Obligations exist from contract inception; revenue timing follows satisfaction."], "source": "ST p.42-43 (Office Solutions example). Scenario and numbers written for this site."}, {"id": "q-ifrs15-002", "standard": "IFRS 15", "topic": "Allocation", "difficulty": "medium", "question": "A customer pays $900 for a phone and a service plan sold together. Stand-alone selling prices are $800 for the phone and $400 for the plan. How much of the $900 is allocated to the phone?", "options": ["$800", "$600", "$450", "$300"], "answer": 1, "explanation": "Allocate by relative stand-alone selling prices: 900 x 800 / (800 + 400) = $600 to the phone and $300 to the plan.", "why_wrong": ["$800 is the stand-alone price, not the share of the discounted total.", "", "$450 splits the price equally, which ignores the selling prices.", "$300 is the amount allocated to the plan."], "source": "ST p.45 (allocation by stand-alone selling price, handset example). Scenario and numbers written for this site."}, {"id": "q-ifrs15-003", "standard": "IFRS 15", "topic": "Variable consideration", "difficulty": "hard", "question": "A supplier sells at $20 a unit. The contract cuts the price retrospectively to $18 if the customer buys more than 1,000 units in the year. In the first quarter the customer buys 200 units and a reversal is not expected, so revenue is $4,000. In the second quarter the customer buys 900 more units and the supplier now expects the discount to apply. What revenue is recognised in the second quarter?", "options": ["$18,000", "$15,800", "$16,200", "$18,400"], "answer": 1, "explanation": "Second-quarter revenue = 900 x $18 = $16,200, less the retrospective price cut on the 200 units already sold (200 x $2 = $400) = $15,800.", "why_wrong": ["$18,000 uses the old price for the new units.", "", "$16,200 forgets to adjust the first quarter's units.", "$18,400 adds the cut instead of deducting it."], "source": "ST p.43-44 (Taplop example). Scenario and numbers written for this site."}, {"id": "q-ifrs15-004", "standard": "IFRS 15", "topic": "Principal vs agent", "difficulty": "medium", "question": "An online platform lets suppliers sell to customers. Suppliers set prices and deliver directly. The platform collects payment and keeps an 8% commission. Sales through the platform in the year total $50,000. What revenue does the platform recognise?", "options": ["$50,000", "$46,000", "$4,000", "$54,000"], "answer": 2, "explanation": "The platform does not control the goods, does not hold inventory and does not set prices, so it is an agent. Revenue is the commission: 8% x $50,000 = $4,000.", "why_wrong": ["Gross revenue is for a principal.", "$46,000 is the amount passed to suppliers.", "", "The commission is not added on top of sales."], "source": "ST p.48 (Fancy Goods Co example). Scenario and numbers written for this site."}, {"id": "q-ifrs15-005", "standard": "IFRS 15", "topic": "Repurchase agreement", "difficulty": "medium", "question": "On 1 March a company sells equipment for $2.0m and receives a call option to buy it back for $2.2m within the year. The customer takes possession. How does the company account for the sale?", "options": ["Revenue of $2.0m, because the customer has possession", "Revenue of $2.2m immediately", "A financing arrangement: asset stays, $2.0m liability plus $0.2m interest", "A lease, because the price is above the original price"], "answer": 2, "explanation": "A call option stops the customer obtaining control. Repurchase price at or above the sale price means a financing arrangement: the company keeps the asset, recognises a liability for cash received and the $0.2m difference as interest.", "why_wrong": ["Possession alone does not transfer control when the seller can call the asset back.", "The repurchase price is not revenue at inception.", "", "A lease applies when the repurchase price is below the original price."], "source": "ST p.48-49 (repurchase agreements, A Co call option example). Scenario and numbers written for this site."}, {"id": "q-ifrs15-006", "standard": "IFRS 15", "topic": "Consignment", "difficulty": "easy", "question": "A manufacturer delivers goods to a dealer who pays only after selling them to end customers and may return unsold goods. When does the manufacturer recognise revenue?", "options": ["On delivery to the dealer", "When the dealer sells the goods to the end customer", "When the dealer pays a deposit", "At the end of the financial year"], "answer": 1, "explanation": "These are consignment indicators: the dealer has no unconditional obligation to pay and can return the goods. Control passes only when the dealer sells on.", "why_wrong": ["Delivery alone does not transfer control under consignment.", "", "A deposit does not transfer control.", "Revenue follows control, not the year end."], "source": "ST p.49-51 (consignment arrangements). Scenario and numbers written for this site."}, {"id": "q-ifrs15-007", "standard": "IFRS 15", "topic": "Over time", "difficulty": "hard", "question": "A contractor has a $2,000,000 contract satisfied over time and measures progress by costs incurred. Costs to date are $600,000 and estimated costs to complete are $900,000. Amounts invoiced to date are $700,000. What contract asset is presented?", "options": ["$100,000", "$800,000", "$1,300,000", "$0, because costs are below the amount invoiced"], "answer": 0, "explanation": "Progress = 600 / (600 + 900) = 40%. Revenue = 40% x 2,000,000 = $800,000. Contract asset = revenue recognised less amounts invoiced = 800,000 - 700,000 = $100,000.", "why_wrong": ["", "$800,000 is revenue, not the contract asset; the invoiced part is a receivable.", "$1,300,000 is the contract price less the invoiced amount.", "Revenue exceeds the amount invoiced, so a contract asset exists."], "source": "ST p.52-54 (over-time contracts, P Co example). Scenario and numbers written for this site."}, {"id": "q-ifrs15-008", "standard": "IFRS 15", "topic": "Presentation", "difficulty": "easy", "question": "A customer pays a $5,000 deposit before the entity has delivered anything. How is the amount presented in the entity's statement of financial position?", "options": ["Revenue", "Receivable", "Contract asset", "Contract liability"], "answer": 3, "explanation": "Consideration received before the entity performs is a contract liability.", "why_wrong": ["Revenue is recognised only as control passes.", "A receivable is an unconditional right to payment after performance.", "A contract asset arises when the entity has performed before being paid.", ""], "source": "ST p.52 (presentation). Scenario and numbers written for this site."}, {"id": "q-ifrs15-009", "standard": "IFRS 15", "topic": "Financing component", "difficulty": "hard", "question": "A company sells goods on 1 January 20X1 for $14,520 payable on 31 December 20X2. The cash price at delivery is $12,000. The implied effective interest rate is 10% a year. Control passes on 1 January 20X1. What interest income is recognised in the year to 31 December 20X1?", "options": ["$0, because payment is not yet due", "$1,200", "$2,520", "$1,452"], "answer": 1, "explanation": "Revenue is the cash price of $12,000. Interest then accrues on the receivable at the effective rate: 12,000 x 10% = $1,200 in year 1.", "why_wrong": ["Interest accrues over the credit period, not only when cash is paid.", "", "$2,520 is the total interest over two years.", "$1,452 applies 10% to the total contract price."], "source": "ST p.44 (Lansdale significant financing example). Rate and numbers written for this site. Scenario and numbers written for this site."}, {"id": "q-ifrs15-010", "standard": "IFRS 15", "topic": "Contract costs", "difficulty": "medium", "question": "A salesperson earns a $5,000 commission only if a contract is won. The company expects to recover it through the contract. Separately it spends $3,000 on tender-preparation travel that it would have incurred whether or not it won. How are these treated?", "options": ["Both capitalised", "Commission capitalised; travel expensed", "Commission expensed; travel capitalised", "Both expensed"], "answer": 1, "explanation": "Incremental costs of obtaining a contract, expected to be recovered, are capitalised. Costs that would be incurred regardless are expensed as incurred.", "why_wrong": ["Costs incurred regardless are not capitalised.", "", "This reverses the rule.", "The commission is incremental and recoverable, so it is capitalised."], "source": "ST p.46 (contract costs). Scenario and numbers written for this site."}, {"id": "q-ifrs15-011", "standard": "IFRS 15", "topic": "Warranties", "difficulty": "medium", "question": "A law requires a retailer to give a one-year warranty on all machines, and customers cannot buy it separately. How is the warranty accounted for?", "options": ["As a separate performance obligation with deferred revenue", "As a provision under IAS 37", "As a contract asset", "It is ignored until a claim is made and paid"], "answer": 1, "explanation": "A legally required warranty that cannot be bought separately is not a performance obligation. It is accounted for under IAS 37.", "why_wrong": ["A separate obligation applies when the customer can buy the warranty separately or it gives a service beyond assurance.", "", "A contract asset is a right to consideration.", "IAS 37 requires a provision when its recognition criteria are met, not only when paid."], "source": "ST p.47 (warranties). Scenario and numbers written for this site."}, {"id": "q-ifrs15-012", "standard": "IFRS 15", "topic": "Right of return", "difficulty": "hard", "question": "A retailer sells 100 units at $50 each (cost $30 each). Based on history, 10 units are expected to be returned. What revenue is recognised on the sale?", "options": ["$5,000", "$4,500", "$500", "$3,000"], "answer": 1, "explanation": "Revenue is recognised only for goods not expected to be returned: 90 x $50 = $4,500. A refund liability of $500 is shown, and an asset of $300 (10 x $30) for the right to recover the goods is adjusted against cost of sales.", "why_wrong": ["$5,000 ignores the expected returns.", "", "$500 is the refund liability.", "$3,000 is the cost of the 100 units."], "source": "ST p.51 (sale with right of return, para. B20 as quoted). Scenario and numbers written for this site."}, {"id": "q-ifrs9-001", "standard": "IFRS 9", "topic": "Definitions", "difficulty": "easy", "question": "Which of the following is NOT a financial instrument?", "options": ["Trade receivable", "Inventories", "Forward contract to buy shares", "Loan note issued by the entity"], "answer": 1, "explanation": "A financial instrument gives rise to a financial asset of one party and a liability or equity of the other. Inventories give goods, not a right to cash.", "why_wrong": ["Gives a right to receive cash.", "", "Gives a contractual right or obligation to exchange financial instruments.", "Gives the holder a right to cash, so it is a financial liability of the issuer."], "source": "ST p.183-184 Scenario and numbers written for this site."}, {"id": "q-ifrs9-002", "standard": "IFRS 9", "topic": "Recognition", "difficulty": "easy", "question": "Rho signs (a) a firm order to buy 500 tonnes of iron for delivery next quarter and (b) a forward contract to buy iron at a fixed price on a set date, with no delivery of iron. When does Rho recognise each?", "options": ["Both at signing", "(a) on delivery; (b) at signing", "(a) at signing; (b) on settlement", "Neither until the cash is paid"], "answer": 1, "explanation": "The order is an ordinary trading contract for a physical item, recognised on delivery. The forward is a financial instrument, recognised when Rho becomes a party to it.", "why_wrong": ["The order for physical iron is not a financial instrument.", "", "The forward is recognised at signing, not at settlement.", "Recognition does not wait for cash."], "source": "ST p.189-190 Scenario and numbers written for this site."}, {"id": "q-ifrs9-003", "standard": "IFRS 9", "topic": "Classification", "difficulty": "medium", "question": "Sigma holds a bond whose cash flows are solely principal and interest. Its business model is to collect cash flows, with occasional sales when a bond's credit rating falls. How is the bond measured?", "options": ["Fair value through profit or loss", "Fair value through other comprehensive income", "Amortised cost", "Cost, with no impairment"], "answer": 2, "explanation": "Both tests are met: SPPI cash flows and a collect-only model. Occasional sales for credit deterioration do not change the objective.", "why_wrong": ["Only for assets that fail a test, or by designation.", "That needs a model of collecting and selling.", "", "Amortised cost is subject to the expected credit loss model."], "source": "ST p.194-195 Scenario and numbers written for this site."}, {"id": "q-ifrs9-004", "standard": "IFRS 9", "topic": "Classification", "difficulty": "medium", "question": "Tau invests in a convertible loan note issued by another company. How is the investment measured?", "options": ["Amortised cost", "Fair value through profit or loss", "Fair value through OCI, mandatory", "Cost less impairment"], "answer": 1, "explanation": "A conversion option means the cash flows are not solely principal and interest, so the asset cannot be at amortised cost or FVOCI (debt).", "why_wrong": ["The SPPI test fails.", "", "FVOCI for debt also requires SPPI.", "IFRS 9 has no cost model for such an asset."], "source": "ST p.196-197 Scenario and numbers written for this site."}, {"id": "q-ifrs9-005", "standard": "IFRS 9", "topic": "Equity instruments", "difficulty": "medium", "question": "Upsilon buys quoted ordinary shares in another entity as a long-term investment. They are not held for trading and no election is made. How are they measured?", "options": ["Amortised cost", "Fair value through OCI automatically", "Fair value through profit or loss", "Equity method"], "answer": 2, "explanation": "Equity instruments must be at fair value. Without the irrevocable election at initial recognition, the default is FVTPL.", "why_wrong": ["Equity shares have no contractual cash flows on specified dates.", "FVOCI needs an irrevocable election at initial recognition.", "", "The equity method is for associates, which are outside IFRS 9."], "source": "ST p.195 Scenario and numbers written for this site."}, {"id": "q-ifrs9-006", "standard": "IFRS 9", "topic": "Transaction costs", "difficulty": "medium", "question": "Phi buys 100,000 shares for trading at $4 each, with transaction costs of $8,000. At year end the price is $4.50. What is the net effect on profit or loss for the year, ignoring dividends?", "options": ["$50,000 gain", "$42,000 gain", "$58,000 gain", "$8,000 loss"], "answer": 1, "explanation": "FVTPL: costs are expensed. Gain = 100,000 x $0.50 = $50,000. Net = $50,000 - $8,000 = $42,000.", "why_wrong": ["Ignores the expensed costs.", "", "Adds the costs instead of deducting them.", "Ignores the fair value gain."], "source": "ST p.202-203 Scenario and numbers written for this site."}, {"id": "q-ifrs9-007", "standard": "IFRS 9", "topic": "Transaction costs", "difficulty": "medium", "question": "Chi buys 100,000 shares at $4 with costs of $8,000 and makes the irrevocable FVOCI election. What is the initial carrying amount?", "options": ["$400,000", "$408,000", "$392,000", "$450,000"], "answer": 1, "explanation": "For FVOCI assets the transaction costs are added to fair value: 400,000 + 8,000 = 408,000.", "why_wrong": ["Leaves out the costs, which apply only for FVTPL.", "", "Costs are deducted for liabilities, not assets.", "That is a later year-end value, not the initial carrying amount."], "source": "ST p.200, p.203 Scenario and numbers written for this site."}, {"id": "q-ifrs9-008", "standard": "IFRS 9", "topic": "Amortised cost", "difficulty": "medium", "question": "On 1 January a company buys a bond for $900. Principal $1,000, fixed coupon 5% paid yearly. The effective interest rate is 8%. What is the carrying amount after the first year's coupon is received?", "options": ["$922", "$950", "$900", "$972"], "answer": 0, "explanation": "Interest income = 900 x 8% = 72. Closing = 900 + 72 - 50 coupon = 922.", "why_wrong": ["", "Uses the coupon rate instead of the effective rate.", "Ignores the unwinding of the discount.", "Adds interest but does not deduct the cash received."], "source": "ST p.201 Scenario and numbers written for this site."}, {"id": "q-ifrs9-009", "standard": "IFRS 9", "topic": "Amortised cost", "difficulty": "medium", "question": "Psi issues a $800,000 zero-coupon bond at par and pays issue costs of $20,000. The effective interest rate is 5%. What is the liability after one year?", "options": ["$840,000", "$819,000", "$800,000", "$780,000"], "answer": 1, "explanation": "Initial amount = 800,000 - 20,000 = 780,000. Finance cost = 780,000 x 5% = 39,000. Closing = 819,000.", "why_wrong": ["Applies 5% to 800,000, ignoring issue costs.", "", "The liability grows through the finance cost.", "This is the opening amount, before the finance cost."], "source": "ST p.204-205 Scenario and numbers written for this site."}, {"id": "q-ifrs9-010", "standard": "IFRS 9", "topic": "Expected credit losses", "difficulty": "medium", "question": "A loan has no significant increase in credit risk. The 12-month probability of default is 4% and the loss if default occurs is $500,000. What is the loss allowance?", "options": ["$20,000", "$50,000", "$500,000", "$0"], "answer": 0, "explanation": "Stage 1: 12-month ECL = 4% x $500,000 = $20,000.", "why_wrong": ["", "That would use a lifetime figure, which Stage 1 does not use.", "That would be the whole loss if default were certain.", "Stage 1 still needs an allowance from initial recognition."], "source": "ST p.209 Scenario and numbers written for this site."}, {"id": "q-ifrs9-011", "standard": "IFRS 9", "topic": "Expected credit losses", "difficulty": "hard", "question": "A loan's 12-month default probability is now 6% and the default probability over the remaining term is 9%. Credit risk has increased significantly since initial recognition. The loss on default is $400,000. What is the allowance?", "options": ["$24,000", "$36,000", "$60,000", "$40,000"], "answer": 2, "explanation": "Stage 2: lifetime ECL. Using the ST method, (6% + 9%) x $400,000 = $60,000.", "why_wrong": ["12-month basis only (6% x 400,000).", "Uses only the remaining-term probability (9%).", "", "Uses 10%, not the figures given."], "source": "ST p.209-210 Scenario and numbers written for this site."}, {"id": "q-ifrs9-012", "standard": "IFRS 9", "topic": "Provision matrix", "difficulty": "medium", "question": "Receivables are $500,000 current (0.5% loss rate), $200,000 1-30 days overdue (2%) and $100,000 over 90 days (20%). The opening allowance is $20,000. What is the charge to profit or loss?", "options": ["$26,500", "$6,500", "$20,000", "$46,500"], "answer": 1, "explanation": "Required allowance = 2,500 + 4,000 + 20,000 = 26,500. Charge = 26,500 - 20,000 = 6,500.", "why_wrong": ["That is the closing allowance, not the charge.", "", "The opening balance is not the charge.", "Adds the opening allowance to the closing one."], "source": "ST p.213-215 Scenario and numbers written for this site."}, {"id": "q-ifrs9-013", "standard": "IFRS 9", "topic": "Reclassification", "difficulty": "medium", "question": "Which event requires reclassification of financial assets under IFRS 9?", "options": ["Management changes its intention for one asset", "A market for a security disappears temporarily", "A bank decides to shut its retail mortgage business and sell the loan portfolio", "An asset is moved between two divisions"], "answer": 2, "explanation": "Reclassification is required only when the business model changes. Selling off a closed business's portfolio is a change.", "why_wrong": ["A change of intention for a particular asset is not a change in business model.", "A temporary market change is not a business model change.", "", "A transfer between parts with different models does not itself change the model."], "source": "ST p.199 Scenario and numbers written for this site."}, {"id": "q-ifrs9-014", "standard": "IFRS 9", "topic": "Hedge accounting", "difficulty": "hard", "question": "Inventory costing $300,000 is hedged by a futures contract. Over the period the inventory fair value rises by $40,000 and the futures lose $35,000. Hedge accounting (fair value hedge) applies. What is the net effect on profit?", "options": ["$40,000 gain", "$35,000 loss", "$5,000 gain", "Nil"], "answer": 2, "explanation": "Both go to profit or loss in the same period: +40,000 on the inventory (carrying amount adjusted) and -35,000 on the futures, net +5,000.", "why_wrong": ["Ignores the futures loss.", "Ignores the inventory gain.", "", "The offset is partial, so a net amount remains."], "source": "ST p.217-219 Scenario and numbers written for this site."}, {"id": "q-ifrs9-015", "standard": "IFRS 9", "topic": "Hedge accounting", "difficulty": "medium", "question": "A forward contract is an effective cash flow hedge of a firm commitment to buy a machine. Before delivery the forward shows a gain of $30,000. Where is the gain recognised?", "options": ["Profit or loss", "OCI, in the cash flow hedge reserve", "Directly against the machine immediately", "Not recognised until settlement"], "answer": 1, "explanation": "The effective part goes to OCI and the reserve. When the machine is recognised, the accumulated amount is transferred into its initial cost.", "why_wrong": ["That is the treatment for a fair value hedge or a non-hedged derivative.", "", "The machine does not yet exist before delivery.", "A derivative is recognised at once at fair value."], "source": "ST p.220-222, Kit fp.145 Scenario and numbers written for this site."}, {"id": "q-ifrs9-016", "standard": "IFRS 9", "topic": "Derecognition", "difficulty": "medium", "question": "Omega sells short-term receivables to a bank and guarantees to compensate the bank for credit losses that are likely to occur. What happens to the receivables?", "options": ["Derecognised in full", "Not derecognised", "Derecognised, with a provision for the guarantee", "Derecognised only if the bank pays cash in advance"], "answer": 1, "explanation": "Omega keeps the credit risk, so substantially all risks and rewards are not transferred.", "why_wrong": ["That needs transfer of substantially all risks and rewards.", "", "The guarantee shows the risk stays with Omega.", "Cash timing does not decide derecognition."], "source": "ST p.190 Scenario and numbers written for this site."}, {"id": "q-ifrs9-017", "standard": "IFRS 9", "topic": "Derecognition of liabilities", "difficulty": "hard", "question": "Remaining cash flows of a loan have a PV of $2,000,000. After renegotiation the new cash flows, discounted at the original effective rate, have a PV of $1,820,000. How is the change treated?", "options": ["As a substantial modification: extinguish the old loan", "As a non-substantial modification: the original liability continues", "As a derecognition gain of $180,000 in OCI", "As a new loan measured at nil"], "answer": 1, "explanation": "The difference is 180,000 / 2,000,000 = 9%, below the 10% threshold, so it is not a substantial modification.", "why_wrong": ["That needs a difference of at least 10%.", "", "Gains on a liability derecognition go to profit or loss, and none is triggered here.", "Nonsense: a liability is not measured at nil."], "source": "ST p.193 Scenario and numbers written for this site."}, {"id": "q-ifrs9-018", "standard": "IFRS 9", "topic": "Business model", "difficulty": "medium", "question": "A treasury portfolio is held to meet liquidity needs. Management sells frequently and significantly to reinvest in higher-yielding assets and also collects contractual cash flows. The assets pass SPPI. How are they measured?", "options": ["Amortised cost", "FVOCI", "FVTPL", "Cost"], "answer": 1, "explanation": "Both collecting and selling are integral to the objective, so the business model is 'collect and sell', which gives FVOCI (debt).", "why_wrong": ["That is for a collect-only model.", "", "FVTPL is the residual category.", "There is no cost category."], "source": "ST p.197-198 Scenario and numbers written for this site."}, {"id": "q-ifrs9-019", "standard": "IFRS 9", "topic": "Liabilities at FVTPL", "difficulty": "hard", "question": "An entity designates a liability at FVTPL. The fair value falls by $50,000, of which $15,000 is due to the entity's own credit risk. Presentation creates no accounting mismatch. Where is the $15,000 recognised?", "options": ["Profit or loss", "OCI", "Equity directly", "Not recognised"], "answer": 1, "explanation": "Changes due to own credit risk go to OCI, and the rest ($35,000) to profit or loss.", "why_wrong": ["That would be right only if OCI treatment created or enlarged an accounting mismatch.", "", "Equity movements are not the route; OCI is.", "The whole fair value change is recognised."], "source": "ST p.207 Scenario and numbers written for this site."}, {"id": "q-ifrs9-020", "standard": "IFRS 9", "topic": "Expected credit losses", "difficulty": "medium", "question": "Which assets are within the IFRS 9 expected credit loss model?", "options": ["Financial assets at FVTPL", "Contract assets under IFRS 15", "Inventories", "Own equity shares issued"], "answer": 1, "explanation": "The ECL model covers amortised cost assets, mandatory FVOCI debt, lease receivables, contract assets, loan commitments and financial guarantees.", "why_wrong": ["FVTPL measurement already reflects losses.", "", "Inventories are not financial instruments.", "Own equity shares are equity, not a financial asset."], "source": "ST p.208-209 Scenario and numbers written for this site."}], "flashcards": [{"id": "f-001", "standard": "IAS 28", "topic": "Definition", "q": "What is significant influence?", "a": "The power to participate in the financial and operating policy decisions of an investee, without control or joint control of those policies.", "source": "ST p.385 (IAS 28 para. 3 as quoted)"}, {"id": "f-002", "standard": "IAS 28", "topic": "20% presumption", "q": "What does a holding of 20% or more of the voting power presume?", "a": "Significant influence, unless it can be clearly shown not to exist. Under 20% is presumed not to give it, unless shown otherwise.", "source": "ST p.385 (IAS 28 para. 5 as quoted); Kit fp.170"}, {"id": "f-003", "standard": "IAS 28", "topic": "Evidence", "q": "Name four usual signs of significant influence.", "a": "Board representation; taking part in policy-making; material transactions with the investee; exchange of managerial staff; providing essential technical information (any four).", "source": "ST p.386 (IAS 28 para. 6 as quoted)"}, {"id": "f-004", "standard": "IAS 28", "topic": "Equity method", "q": "How is an associate measured under the equity method?", "a": "At cost, adjusted for the investor's share of the post-acquisition change in the associate's net assets. It is not the fair value of the shares.", "source": "Kit fp.170, fp.279"}, {"id": "f-005", "standard": "IAS 28", "topic": "Equity method", "q": "Is cash in transit from an associate adjusted, as for a subsidiary?", "a": "No. An associate is not consolidated line by line, so no cash-in-transit adjustment is made.", "source": "Kit fp.187 (examiner comment)"}, {"id": "f-006", "standard": "IAS 28", "topic": "Unrealised profit", "q": "How much unrealised profit on sales to an associate is eliminated, and against what?", "a": "Only the investor's share, against the investment in associate.", "source": "Kit fp.187, fp.170"}, {"id": "f-007", "standard": "IFRS 11", "topic": "Joint control", "q": "When does joint control exist?", "a": "When decisions about the relevant activities need the unanimous consent of the parties sharing control (contractually agreed sharing of control).", "source": "Kit fp.256"}, {"id": "f-008", "standard": "IFRS 11", "topic": "Types", "q": "Joint operation vs joint venture: what is the test?", "a": "Joint operation: parties have direct rights to assets and obligations for liabilities. Joint venture: parties have rights to the net assets of the arrangement.", "source": "Kit fp.256-257, fp.100"}, {"id": "f-009", "standard": "IFRS 11", "topic": "Accounting", "q": "How does a party account for a joint operation, and for a joint venture?", "a": "Joint operation: recognise its own share of each asset, liability, revenue and expense. Joint venture: equity method, one investment line.", "source": "Kit fp.100, fp.257"}, {"id": "f-ias32-001", "standard": "IAS 32", "topic": "Core principle", "q": "What is the critical feature of a financial liability?", "a": "A contractual obligation to deliver cash or another financial asset.", "source": "ST p.186"}, {"id": "f-ias32-002", "standard": "IAS 32", "topic": "Preference shares", "q": "How are redeemable preference shares classified?", "a": "As liabilities: the issuer must redeem them.", "source": "ST p.186"}, {"id": "f-ias32-003", "standard": "IAS 32", "topic": "Compound instruments", "q": "In which order is a convertible split?", "a": "Liability first (discounted at the straight-debt rate), then equity as the residual.", "source": "ST p.187"}, {"id": "f-ias32-004", "standard": "IAS 32", "topic": "Compound instruments", "q": "Does the split change if conversion becomes more or less likely?", "a": "No, it stays the same until conversion, maturity or another transaction.", "source": "ST p.188"}, {"id": "f-ias32-005", "standard": "IAS 32", "topic": "Treasury shares", "q": "Gain or loss on buying back own shares?", "a": "None in profit or loss. Deduct from equity.", "source": "ST p.188"}, {"id": "f-ias32-006", "standard": "IAS 32", "topic": "Offsetting", "q": "What two conditions allow offsetting?", "a": "A legally enforceable right of set-off, and intention to settle net or simultaneously.", "source": "ST p.188"}, {"id": "f-ias32-007", "standard": "IAS 32", "topic": "Contingent settlement", "q": "How is an instrument with a not-remote contingent cash settlement classified?", "a": "As a financial liability.", "source": "ST p.186"}, {"id": "f-ias32-008", "standard": "IAS 32", "topic": "Equity costs", "q": "Where do transaction costs of an equity issue go?", "a": "Deducted from equity, usually share premium.", "source": "ST p.188"}, {"id": "f-ifrs15-001", "standard": "IFRS 15", "topic": "Core principle", "q": "What is the core principle of IFRS 15?", "a": "Revenue is recognised to depict the transfer of promised goods or services to a customer, in an amount reflecting the consideration the entity expects to be entitled to.", "source": "ST p.40"}, {"id": "f-ifrs15-002", "standard": "IFRS 15", "topic": "Control", "q": "How does IFRS 15 define control of an asset?", "a": "The ability to direct the use of the asset and obtain substantially all of its remaining benefits.", "source": "ST p.40"}, {"id": "f-ifrs15-003", "standard": "IFRS 15", "topic": "Five steps", "q": "List the five steps of IFRS 15.", "a": "1 Identify the contract. 2 Identify the performance obligations. 3 Determine the transaction price. 4 Allocate the price. 5 Recognise revenue when (or as) each obligation is satisfied.", "source": "ST p.42"}, {"id": "f-ifrs15-004", "standard": "IFRS 15", "topic": "Contract criteria", "q": "What conditions must a contract meet to be within IFRS 15?", "a": "Approved and committed; rights identifiable; payment terms identifiable; commercial substance; collection probable.", "source": "ST p.42 (paras. 9-10)"}, {"id": "f-ifrs15-005", "standard": "IFRS 15", "topic": "Distinct", "q": "When is a promised good or service distinct?", "a": "The customer can benefit from it on its own (or with readily available resources) AND it is separately identifiable from other promises in the contract.", "source": "ST p.42 (paras. 22, 27, 29)"}, {"id": "f-ifrs15-006", "standard": "IFRS 15", "topic": "Variable consideration", "q": "When is variable consideration included in the transaction price?", "a": "Only if it is highly probable that a significant reversal of revenue will not occur when the uncertainty is resolved.", "source": "ST p.43"}, {"id": "f-ifrs15-007", "standard": "IFRS 15", "topic": "Allocation", "q": "How is the transaction price allocated?", "a": "In proportion to the stand-alone selling prices of each performance obligation (estimated if not sold separately).", "source": "ST p.45"}, {"id": "f-ifrs15-008", "standard": "IFRS 15", "topic": "Over time", "q": "When is revenue recognised over time?", "a": "If the customer simultaneously receives and consumes the benefit; or the work creates/enhances an asset the customer controls; or no alternative-use asset is created and the entity has an enforceable right to payment to date.", "source": "ST p.45"}, {"id": "f-ifrs15-009", "standard": "IFRS 15", "topic": "Control indicators", "q": "Name the indicators that control has passed at a point in time.", "a": "Present right to payment; legal title; physical possession; risks and rewards transferred; customer acceptance.", "source": "ST p.46"}, {"id": "f-ifrs15-010", "standard": "IFRS 15", "topic": "Progress", "q": "Output vs input methods?", "a": "Output: value to the customer of what was transferred (surveys, units delivered). Input: entity's inputs (labour hours, costs incurred).", "source": "ST p.46"}, {"id": "f-ifrs15-011", "standard": "IFRS 15", "topic": "Principal vs agent", "q": "Principal vs agent: revenue amount?", "a": "Principal controls the goods first and records gross revenue. Agent arranges the supply and records only its fee or commission.", "source": "ST p.48"}, {"id": "f-ifrs15-012", "standard": "IFRS 15", "topic": "Repurchase", "q": "Forward or call option with repurchase price at or above the sale price?", "a": "No control transfer. Financing arrangement: keep the asset, recognise a liability, difference is interest. If the price is below the sale price: lease (IFRS 16).", "source": "ST p.48-49"}, {"id": "f-ifrs15-013", "standard": "IFRS 15", "topic": "Bill-and-hold", "q": "What must all be true for control to pass in a bill-and-hold sale?", "a": "Substantive reason; goods separately identified as the customer's; ready for transfer; entity cannot use them or send them to another customer.", "source": "ST p.51"}, {"id": "f-ifrs15-014", "standard": "IFRS 15", "topic": "Presentation", "q": "Contract asset, receivable, contract liability: what differs?", "a": "Contract asset: performed, right to payment conditional on more than time. Receivable: unconditional, only time. Contract liability: paid or due before performance.", "source": "ST p.41, p.52"}, {"id": "f-ifrs15-015", "standard": "IFRS 15", "topic": "Return", "q": "How is a sale with a right of return recorded?", "a": "No revenue for goods expected back. Refund liability, reduce revenue, and an asset for the right to recover the goods (adjusted against cost of sales).", "source": "ST p.51 (para. B20)"}, {"id": "f-ifrs15-016", "standard": "IFRS 15", "topic": "Warranty", "q": "How is a warranty that is required by law and not sold separately treated?", "a": "Not a performance obligation. Account for it under IAS 37.", "source": "ST p.47"}, {"id": "f-ifrs9-001", "standard": "IFRS 9", "topic": "Definitions", "q": "What three features make a contract a derivative?", "a": "Value moves with an underlying; little or no initial net investment; settled at a future date.", "source": "ST p.183"}, {"id": "f-ifrs9-002", "standard": "IFRS 9", "topic": "Recognition", "q": "When is a financial instrument recognised?", "a": "When the entity becomes a party to the contractual provisions.", "source": "ST p.189"}, {"id": "f-ifrs9-003", "standard": "IFRS 9", "topic": "Derecognition", "q": "When is a financial asset derecognised?", "a": "When the rights to cash flows expire, or when it is transferred and substantially all risks and rewards pass.", "source": "ST p.190"}, {"id": "f-ifrs9-004", "standard": "IFRS 9", "topic": "Derecognition", "q": "Give two cases where a sold financial asset is NOT derecognised.", "a": "Sale and repurchase at a fixed price; sale with a total return swap; receivables sold with a credit loss guarantee; stock lending.", "source": "ST p.190, p.193"}, {"id": "f-ifrs9-005", "standard": "IFRS 9", "topic": "Derecognition", "q": "What is the test for a substantial modification of a liability?", "a": "PV of new cash flows (at the original EIR) differs by at least 10% from the PV of the remaining original cash flows.", "source": "ST p.193"}, {"id": "f-ifrs9-006", "standard": "IFRS 9", "topic": "Classification", "q": "What two tests classify a financial asset?", "a": "The business model for managing it, and the contractual cash flow (SPPI) test.", "source": "ST p.194"}, {"id": "f-ifrs9-007", "standard": "IFRS 9", "topic": "Classification", "q": "When is a debt asset at amortised cost?", "a": "Held to collect contractual cash flows, and cash flows are solely principal and interest.", "source": "ST p.194"}, {"id": "f-ifrs9-008", "standard": "IFRS 9", "topic": "Classification", "q": "When is a debt asset at FVOCI?", "a": "Business model is both collecting and selling, and cash flows are solely principal and interest.", "source": "ST p.194"}, {"id": "f-ifrs9-009", "standard": "IFRS 9", "topic": "Classification", "q": "What is the residual category for financial assets?", "a": "Fair value through profit or loss.", "source": "ST p.195"}, {"id": "f-ifrs9-010", "standard": "IFRS 9", "topic": "Classification", "q": "Which instruments fail SPPI?", "a": "Convertible loans, and inverse floating rate loans.", "source": "ST p.196-197"}, {"id": "f-ifrs9-011", "standard": "IFRS 9", "topic": "Equity", "q": "What election exists for equity investments not held for trading?", "a": "An irrevocable election at initial recognition to take fair value changes in OCI. Only dividends go to profit or loss.", "source": "ST p.195"}, {"id": "f-ifrs9-012", "standard": "IFRS 9", "topic": "Reclassification", "q": "When can financial assets be reclassified?", "a": "Only when the business model changes, applied prospectively. Liabilities are never reclassified.", "source": "ST p.199"}, {"id": "f-ifrs9-013", "standard": "IFRS 9", "topic": "Measurement", "q": "Initial measurement of a financial asset?", "a": "Fair value. Add transaction costs unless the asset is at FVTPL, where they are expensed.", "source": "ST p.200"}, {"id": "f-ifrs9-014", "standard": "IFRS 9", "topic": "Measurement", "q": "Initial measurement of a liability at amortised cost?", "a": "Fair value of consideration received, less transaction costs.", "source": "ST p.204"}, {"id": "f-ifrs9-015", "standard": "IFRS 9", "topic": "Measurement", "q": "Which liabilities are not at amortised cost?", "a": "Held for trading, derivatives, liabilities designated at FVTPL, failed-derecognition liabilities, financial guarantees and below-market loan commitments.", "source": "ST p.198"}, {"id": "f-ifrs9-016", "standard": "IFRS 9", "topic": "Own credit risk", "q": "Where does the own-credit part of a designated liability's fair value change go?", "a": "OCI, unless that creates or enlarges an accounting mismatch.", "source": "ST p.207"}, {"id": "f-ifrs9-017", "standard": "IFRS 9", "topic": "ECL", "q": "What does 12-month ECL equal?", "a": "The probability of default in the next 12 months multiplied by the total lifetime loss if default occurs.", "source": "ST p.209"}, {"id": "f-ifrs9-018", "standard": "IFRS 9", "topic": "ECL", "q": "What is the rebuttable presumption for lifetime ECL?", "a": "A significant increase in credit risk if payments are 30 days past due.", "source": "ST p.210"}, {"id": "f-ifrs9-019", "standard": "IFRS 9", "topic": "ECL", "q": "How does interest differ in stage 3?", "a": "Interest is calculated on the carrying amount net of the allowance, not on the gross amount.", "source": "ST p.210-211"}, {"id": "f-ifrs9-020", "standard": "IFRS 9", "topic": "ECL", "q": "What approach applies to trade receivables with no financing component?", "a": "Simplified: lifetime ECL from initial recognition, often with a provision matrix.", "source": "ST p.213"}, {"id": "f-ifrs9-021", "standard": "IFRS 9", "topic": "Hedging", "q": "Which hedges are examinable?", "a": "Fair value hedges and cash flow hedges. Net investment hedges are not.", "source": "ST p.216, p.219"}, {"id": "f-ifrs9-022", "standard": "IFRS 9", "topic": "Hedging", "q": "How is a cash flow hedge's effective gain recorded?", "a": "In OCI and the cash flow hedge reserve. Excess goes to profit or loss.", "source": "ST p.220"}, {"id": "f-ifrs9-023", "standard": "IFRS 9", "topic": "Hedging", "q": "What happens to the reserve when a hedged forecast purchase creates a non-financial asset?", "a": "It is removed and included in the asset's initial cost.", "source": "ST p.220"}, {"id": "f-ifrs9-024", "standard": "IFRS 9", "topic": "Hedging", "q": "What conditions must a hedge meet?", "a": "Eligible items, formal documentation at inception, an economic relationship, credit risk not dominating, and a correct hedge ratio.", "source": "ST p.217"}], "traps": [{"page": "ifrs/ifrs-15", "title": "IFRS 15 — Revenue from Contracts with Customers / الإيراد من العقود مع العملاء", "heading": "Common mistakes / أخطاء شائعة", "text": "- Listing the five steps with no application (ST p.42, June 2024 examiner's report).\n- Short answers: one well-explained point is worth about one mark, so match the points to the marks (ST p.41, June 2023 examiner's report).\n- Forgetting that a contract with several distinct promises needs the price **allocated by SSP** (Kit Q2).\n- Recognising revenue on consignment goods at delivery.\n- Treating a legally required warranty as a separate performance obligation. It is IAS 37.\n- Showing an agent's gross sales as revenue instead of the commission.\n- Forgetting the financing component when payment is deferred well beyond 12 months (Kit fp.94)."}, {"page": "ifrs/ifrs-15", "title": "IFRS 15 — Revenue from Contracts with Customers / الإيراد من العقود مع العملاء", "heading": "Exam focus / ما يتكرر في الامتحان", "text": "- June 2023 (15-mark requirement): a contract to construct and install complex machinery, a single performance obligation recognised over time (ST p.41).\n- Kit questions that use IFRS 15: Q2 (answer fp.93-94), Q3 (fp.95), Q4 (fp.98), Q9 (fp.112), Q15 (fp.124), Q33 (fp.167), Mock 1 Q4, Mock 2 Q2.\n- ACCA technical article \"Revenue revisited\" and a topic explainer video are on the DipIFR resources page (ST p.40). Not part of the uploaded files."}, {"page": "ifrs/ifrs-9", "title": "IFRS 9 — Financial Instruments / الأدوات المالية", "heading": "Common mistakes / أخطاء شائعة", "text": "- Choosing the classification by management's **intention for one asset** instead of the portfolio business model (ST p.194, p.199).\n- Treating the equity FVOCI election as available **for debt** (it is not, and for debt FVOCI is mandatory if the test is met) (ST p.195).\n- Forgetting that **transaction costs are expensed** at FVTPL but **capitalised** otherwise (ST p.203, Kit fp.130, fp.133).\n- Using 12-month ECL for a loan after a **significant increase** in credit risk (ST p.209).\n- Calculating the 12-month ECL as the expected cash shortfall in 12 months. It is probability of default in 12 months x lifetime loss.\n- Applying the amortised-cost interest to the **closing** balance instead of the **opening** balance.\n- Recognising the **firm commitment** itself in a cash flow hedge (Kit fp.144).\n- Applying ECL to FVTPL assets, which do not need it.\n- Reclassifying liabilities (never allowed) or reclassifying assets without a change in business model."}, {"page": "ifrs/ifrs-9", "title": "IFRS 9 — Financial Instruments / الأدوات المالية", "heading": "Exam focus / ما يتكرر في الامتحان", "text": "- June 2024: 10 marks on measurement of financial assets and the meaning of fair value, in answers to a trainee's questions. The examiner noted confusion between assets and liabilities and few references to IFRS 13 (ST p.204).\n- September 2020: a cash flow hedge of a future firm commitment, Question 2. Answers were generally unsatisfactory because candidates did not explain the effect of hedge accounting (ST p.219, Kit Q23).\n- IFRS 9 often appears inside a larger scenario question, so expect calculations (ST p.182).\n- Kit questions: Q7, Q12, Q17, Q18, Q21, Q23, Q46, Mock 1 Q1 and Q4, Mock 2 Q2, Mock 3 Q3. Only Q17, Q18 and Q23 were read in detail for this page; the others are not summarised here.\n- IFRS 7 disclosures are not tested (ST p.223)."}, {"page": "ias/ias-28-ifrs-11-from-kit", "title": "IAS 28
