<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b5d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IFRS">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>IFRS Study Site</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
  <a class="brand" href="#/home">IFRS<span>Study</span></a>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="ابحث / Search…" autocomplete="off" aria-label="Search">
    <div id="searchResults" class="search-results" hidden></div>
  </div>
  <button id="langBtn" class="icon-btn" title="Language">EN</button>
  <button id="themeBtn" class="icon-btn" title="Dark / Light">◐</button>
</header>
<div class="layout">
  <nav id="sidebar" class="sidebar" aria-label="Sections"></nav>
  <main id="main" class="main" tabindex="-1"></main>
  <aside id="toc" class="toc" aria-label="Contents"></aside>
</div>
<div id="scrim" class="scrim" hidden></div>
<script src="assets/content.js"></script>
<script src="assets/app.js"></script>
<script>if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
